version: '3.8'

services:
  pyspark:
    image: bitnami/spark:3.4.1
    container_name: pyspark_abap_migration
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=pyspark
      - SPARK_MASTER_PORT=7077
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ./:/app
      - ./data:/data
      - ./logs:/logs
      - ./output:/output
    working_dir: /app
    command: >
      bash -c "
      pip install --no-cache-dir -r requirements.txt &&
      tail -f /dev/null
      "
    networks:
      - spark_network

networks:
  spark_network:
    driver: bridge