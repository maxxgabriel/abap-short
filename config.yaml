# ETL Configuration File
# Override default constants with environment-specific values

# ETL Processing Configuration
batch_size: 1000
commit_interval: 500
retry_attempts: 3
timeout_seconds: 3600
parallel_jobs: 4

# Business Rules Configuration
# Discount thresholds
discount_qty_tier1: 10
discount_qty_tier2: 15

# Discount rates (as decimal strings for precision)
discount_rate_tier1: "0.05"
discount_rate_tier2: "0.10"

# Tax rate
tax_rate: "0.08"

# Cost ratio for profit calculation
cost_ratio: "0.60"

# Category thresholds
category_high_threshold: "2000.00"
category_medium_threshold: "500.00"

# Spark Configuration
spark_app_name: "SalesETL"
spark_master: "local[*]"
spark_shuffle_partitions: 200

# Data Paths
raw_data_path: "data/raw/sales"
analytics_data_path: "data/analytics/sales"
log_path: "data/logs"
checkpoint_path: "data/checkpoints"

# Logging Configuration
log_level: "INFO"
enable_console_logging: true
enable_file_logging: true