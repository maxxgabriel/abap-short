# ETL Configuration for Sales Analytics Pipeline
# Migrated from ABAP ETL System

application:
  name: "Sales ETL System"
  version: "1.0.0"
  component: "FI-AA"

# Status codes
status:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# ETL process steps
steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Sale categories
categories:
  high: "HIGH"
  medium: "MEDIUM"
  low: "LOW"

# Business rules - Discount thresholds
discount:
  quantity_tier1: 10
  quantity_tier2: 15
  rate_tier1: 0.05
  rate_tier2: 0.10

# Business rules - Tax rate
tax:
  rate: 0.08

# Business rules - Cost ratio
cost:
  ratio: 0.60

# Business rules - Category thresholds
category_thresholds:
  high: 2000.00
  medium: 500.00

# ETL configuration defaults
etl_config:
  default_batch_size: 1000
  default_commit_interval: 500
  default_retry_attempts: 3
  default_timeout_seconds: 3600
  parallel_jobs: 4

# ID prefixes
prefixes:
  etl_run: "ETL"
  log_id: "LOG"
  analytics_id: "ANL"

# Message texts
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"

# Database configuration
database:
  source_table: "zsales_raw"
  target_table: "zsales_analytics"
  log_table: "zetl_log"

# Spark configuration
spark:
  app_name: "SalesETL"
  master: "local[*]"
  executor_memory: "4g"
  driver_memory: "2g"
  sql_shuffle_partitions: 200

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl_process.log"