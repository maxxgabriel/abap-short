# ETL Logger Configuration

# Database configuration
database:
  # Database type: 'jdbc', 'hana', or 'delta'
  type: jdbc
  
  # JDBC configuration (for generic JDBC connections)
  jdbc_url: jdbc:sap://hostname:30015
  driver: com.sap.db.jdbc.Driver
  user: ETL_USER
  password: ${DB_PASSWORD}  # Use environment variable
  
  # SAP HANA configuration (alternative)
  hana_url: jdbc:sap://hostname:30015
  
  # Delta Lake configuration (alternative)
  delta_log_path: /mnt/delta/zetl_log
  
  # Table names
  log_table: ZETL_LOG
  raw_table: ZSALES_RAW
  analytics_table: ZSALES_ANALYTICS

# ETL process configuration
etl:
  # Batch processing
  batch_size: 1000
  commit_interval: 500
  
  # Retry configuration
  retry_attempts: 3
  retry_delay_seconds: 5
  
  # Timeout configuration
  timeout_seconds: 3600
  
  # Parallel processing
  parallel_jobs: 4

# Status codes
status_codes:
  new: N
  processed: P
  error: E
  warning: W
  success: S
  info: I

# Process steps
process_steps:
  init: INIT
  extract: EXTRACT
  transform: TRANSFORM
  load: LOAD
  validate: VALIDATE
  complete: COMPLETE
  error: ERROR

# Business rules
business_rules:
  # Discount thresholds
  discount_qty_tier1: 10
  discount_qty_tier2: 15
  discount_rate_tier1: 0.05
  discount_rate_tier2: 0.10
  
  # Tax rate
  tax_rate: 0.08
  
  # Cost ratio
  cost_ratio: 0.60
  
  # Category thresholds
  category_high_threshold: 2000.00
  category_medium_threshold: 500.00

# Logging configuration
logging:
  level: INFO
  format: "[%(asctime)s] [%(levelname)s] %(message)s"
  
# Spark configuration
spark:
  app_name: Sales_ETL_Process
  master: local[*]
  config:
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.executor.memory: 4g
    spark.driver.memory: 2g

# System configuration
system:
  user: etl_system
  environment: production