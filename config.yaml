# PySpark ETL Configuration for Sales Data Processing

# Spark Configuration
spark:
  app_name: "SalesETLTransformer"
  master: "local[*]"
  log_level: "WARN"
  
# Business Rules - Discount Thresholds
business_rules:
  discount:
    quantity_tier1: 10
    quantity_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10
  
  # Tax Rate
  tax_rate: 0.08
  
  # Cost Ratio (for profit margin calculation)
  cost_ratio: 0.60
  
  # Category Thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# ETL Configuration
etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600

# Status Codes
status_codes:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# Process Steps
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Categories
categories:
  high: "HIGH"
  medium: "MEDIUM"
  low: "LOW"

# ID Prefixes
id_prefixes:
  etl_run: "ETL"
  log_id: "LOG"
  analytics_id: "ANL"

# Data Sources (example paths - adjust for your environment)
data_sources:
  raw_sales_path: "data/raw/sales"
  analytics_output_path: "data/analytics/sales"
  log_output_path: "data/logs/etl"
  
# File Formats
file_formats:
  input_format: "parquet"  # or "csv", "json"
  output_format: "parquet"
  
# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"