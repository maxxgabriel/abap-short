# ETL Configuration
# Converted from ABAP package configuration

etl:
  # Batch processing settings
  batch_size: 1000
  commit_interval: 500
  parallel_jobs: 4
  retry_attempts: 3
  timeout_seconds: 3600
  
  # Business rules - Discounts
  discount:
    qty_tier1: 10
    qty_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10
  
  # Business rules - Tax
  tax:
    rate: 0.08
  
  # Business rules - Cost calculation
  cost:
    ratio: 0.60
  
  # Business rules - Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00
  
  # ID generation prefixes
  prefixes:
    etl_run: "ETL"
    log_id: "LOG"
    analytics_id: "ANL"

# Database configuration
database:
  # Source table
  source_table: "zsales_raw"
  
  # Target table
  target_table: "zsales_analytics"
  
  # Log table
  log_table: "zetl_log"
  
  # Connection settings
  connection:
    driver: "org.apache.spark.sql.jdbc"
    isolation_level: "READ_COMMITTED"

# Spark configuration
spark:
  app_name: "Sales_ETL_Process"
  master: "local[*]"
  
  # Spark settings
  config:
    "spark.sql.shuffle.partitions": "200"
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.default.parallelism": "8"
    "spark.sql.sources.partitionOverwriteMode": "dynamic"
  
  # Memory settings
  memory:
    driver: "2g"
    executor: "4g"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl_process.log"
  console: true

# Test mode settings
test_mode:
  enabled: false
  sample_size: 100
  skip_commit: true