# Sales ETL System Configuration

etl:
  app_name: "SalesETLSystem"
  run_id_prefix: "ETL"
  
  # Processing parameters
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  
  # Date range (can be overridden by command line)
  default_lookback_days: 7

# Spark Configuration
spark:
  master: "local[*]"  # Override in production
  app_name: "Sales ETL Pipeline"
  
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.default.parallelism: "200"
    spark.driver.memory: "4g"
    spark.executor.memory: "4g"
    spark.executor.cores: "2"
    
# Business Rules
business_rules:
  # Discount thresholds
  discount:
    tier1_quantity: 10
    tier1_rate: 0.05
    tier2_quantity: 15
    tier2_rate: 0.10
  
  # Tax configuration
  tax:
    rate: 0.08
  
  # Cost calculation
  cost:
    ratio: 0.60  # Cost is 60% of unit price
  
  # Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Data sources
data_sources:
  raw_sales:
    format: "parquet"  # parquet, csv, jdbc, delta
    path: "data/raw/sales"
    options:
      header: "true"
      inferSchema: "false"
  
  # For JDBC sources (commented out - configure as needed)
  # raw_sales_jdbc:
  #   format: "jdbc"
  #   url: "jdbc:postgresql://localhost:5432/sales_db"
  #   table: "zsales_raw"
  #   properties:
  #     user: "etl_user"
  #     password: "${DB_PASSWORD}"
  #     driver: "org.postgresql.Driver"

# Data targets
data_targets:
  analytics:
    format: "parquet"
    path: "data/analytics/sales"
    mode: "append"  # overwrite, append, ignore, error
    partition_by:
      - "trans_date"
      - "region"
  
  etl_log:
    format: "parquet"
    path: "data/logs/etl"
    mode: "append"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  handlers:
    console:
      enabled: true
      level: "INFO"
    
    file:
      enabled: true
      level: "DEBUG"
      path: "logs/etl.log"
      max_bytes: 10485760  # 10MB
      backup_count: 5

# Status codes
status_codes:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# Process steps
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Categories
categories:
  high: "HIGH"
  medium: "MEDIUM"
  low: "LOW"