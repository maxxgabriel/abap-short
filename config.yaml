# ETL Configuration File
# Sales Analytics ETL System

# Spark Configuration
spark:
  app_name: "Sales_ETL_Loader"
  master: "local[*]"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.sql.parquet.compression.codec: "snappy"
    spark.databricks.delta.optimizeWrite.enabled: "true"
    spark.databricks.delta.autoCompact.enabled: "true"

# Source Configuration
source:
  path: "data/raw/sales_raw"
  format: "parquet"
  date_column: "trans_date"

# Target Configuration
target:
  path: "data/analytics/sales_analytics"
  format: "delta"  # Options: delta, parquet, orc
  write_mode: "append"  # Options: append, overwrite, errorifexists
  
  # Partitioning
  partition_by:
    - "trans_date"
    - "region"
  
  # Bucketing (optional)
  bucket_by:
    num_buckets: 10
    columns:
      - "customer_id"
  
  # Compression
  compression: "snappy"  # Options: snappy, gzip, lz4, zstd
  
  # Optimization
  optimize_after_write: true
  vacuum_retention_hours: 168  # 7 days
  
  # Additional options
  options:
    mergeSchema: "true"
    overwriteSchema: "false"

# Error Handling Configuration
error_handling:
  error_path: "data/errors/invalid_records"
  max_invalid_records_log: 100
  fail_on_validation_threshold: 0.1  # Fail if >10% records invalid

# Business Rules
business_rules:
  # Discount tiers
  discount:
    tier1:
      quantity_threshold: 10
      rate: 0.05
    tier2:
      quantity_threshold: 15
      rate: 0.10
  
  # Tax rate
  tax_rate: 0.08
  
  # Cost ratio for profit calculation
  cost_ratio: 0.60
  
  # Category thresholds
  category_thresholds:
    high: 2000.00
    medium: 500.00

# Validation Rules
validation:
  required_fields:
    - analytics_id
    - customer_id
    - product_id
    - gross_amount
    - currency
    - category
  
  allowed_categories:
    - "HIGH"
    - "MEDIUM"
    - "LOW"
  
  numeric_ranges:
    gross_amount:
      min: 0.01
      max: 999999.99
    quantity:
      min: 1
      max: 10000

# ETL Configuration
etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_jobs: 4

# Logging Configuration
logging:
  level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  log_path: "logs/etl_load.log"
  console_output: true
  db_logging: true
  log_table: "etl_log"

# System Configuration
system:
  system_user: "spark_etl"
  run_id_prefix: "ETL"
  timezone: "UTC"

# Performance Tuning
performance:
  cache_intermediate_results: true
  repartition_before_write: true
  target_partition_size_mb: 128
  max_records_per_file: 100000