# Sales ETL System Configuration
# This file contains all configurable parameters for the ETL process

etl:
  # Batch processing configuration
  batch_size: 1000              # Number of records per batch
  commit_interval: 500          # Records between commits
  retry_attempts: 3             # Number of retry attempts on failure
  timeout_seconds: 3600         # Maximum execution time (1 hour)
  
  # Run mode
  test_mode: false              # Set to true to skip data commits

# Business rules configuration
business_rules:
  # Discount calculation rules
  discount:
    qty_tier1: 10               # First discount tier quantity threshold
    qty_tier2: 15               # Second discount tier quantity threshold
    rate_tier1: 0.05            # First tier discount rate (5%)
    rate_tier2: 0.10            # Second tier discount rate (10%)
  
  # Tax configuration
  tax_rate: 0.08                # Tax rate (8%)
  
  # Cost and profit calculation
  cost_ratio: 0.60              # Cost as percentage of unit price (60%)
  
  # Sale categorization thresholds
  category_thresholds:
    high: 2000.00               # High value sale threshold
    medium: 500.00              # Medium value sale threshold
    # Below medium is considered LOW

# Spark configuration
spark:
  app_name: "SalesETL"
  master: "local[*]"            # Use all available cores
  executor_memory: "2g"
  driver_memory: "1g"
  executor_cores: 2
  sql_shuffle_partitions: 200
  
  # Advanced Spark settings
  advanced:
    adaptive_enabled: true
    broadcast_timeout: 300
    network_timeout: 120

# Data paths configuration
paths:
  # Input data location
  input: "data/input"
  input_format: "parquet"       # parquet, csv, json
  
  # Output data location
  output: "data/output"
  output_format: "parquet"      # parquet, csv, json
  output_mode: "append"         # append, overwrite
  
  # Logging location
  logs: "logs"
  log_level: "INFO"             # DEBUG, INFO, WARNING, ERROR

# Database connection (optional - for actual database integration)
database:
  enabled: false
  host: "localhost"
  port: 5432
  database: "sales_etl"
  user: "etl_user"
  password: ""                  # Use environment variable in production
  
  # Table names
  tables:
    raw_sales: "zsales_raw"
    analytics: "zsales_analytics"
    etl_log: "zetl_log"

# Status codes
status_codes:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# Process step identifiers
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Category definitions
categories:
  high: "HIGH"
  medium: "MEDIUM"
  low: "LOW"

# ID prefixes for generated identifiers
id_prefixes:
  etl_run: "ETL"
  log: "LOG"
  analytics: "ANL"

# Message templates
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"

# Validation rules
validation:
  required_fields:
    - trans_id
    - customer_id
    - product_id
    - quantity
    - unit_price
  
  field_constraints:
    quantity_min: 1
    quantity_max: 10000
    unit_price_min: 0.01
    unit_price_max: 999999.99

# Performance tuning
performance:
  enable_cache: true
  persist_level: "MEMORY_AND_DISK"
  checkpoint_interval: 10
  repartition_count: null       # null for auto-detect