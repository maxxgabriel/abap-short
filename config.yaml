# ETL Logger Configuration
# Migrated from ABAP ZCL_ETL_CONSTANTS

# Logging Configuration
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR
  console_output: true
  persist_logs: true
  log_format: "%(asctime)s - %(name)s - [%(levelname)s] - %(message)s"

# Status Codes (from ABAP gc_status)
status_codes:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# Process Steps (from ABAP gc_step)
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# ETL Configuration
etl:
  default_batch_size: 1000
  default_commit_interval: 500
  default_retry_attempts: 3
  default_timeout_seconds: 3600
  run_id_prefix: "ETL"
  log_id_prefix: "LOG"

# Storage Configuration
storage:
  log_path: "s3://etl-bucket/logs"  # Change to your storage path
  log_format: "parquet"  # parquet, delta, csv
  log_write_mode: "append"  # append, overwrite
  partition_by:
    - "execution_date"

# Message Templates (from ABAP gc_msg_*)
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"

# Spark Configuration
spark:
  app_name: "ETL_Logger"
  master: "local[*]"  # Change for cluster deployment
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"