# ETL Logger Configuration
logging:
  version: 1
  disable_existing_loggers: false
  
  formatters:
    standard:
      format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
      datefmt: '%Y-%m-%d %H:%M:%S'
    
    detailed:
      format: '%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s'
      datefmt: '%Y-%m-%d %H:%M:%S'
    
    json:
      class: pythonjsonlogger.jsonlogger.JsonFormatter
      format: '%(asctime)s %(name)s %(levelname)s %(message)s'

  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: standard
      stream: ext://sys.stdout
    
    file:
      class: logging.handlers.RotatingFileHandler
      level: DEBUG
      formatter: detailed
      filename: logs/etl_process.log
      maxBytes: 10485760  # 10MB
      backupCount: 5
      encoding: utf8
    
    error_file:
      class: logging.handlers.RotatingFileHandler
      level: ERROR
      formatter: detailed
      filename: logs/etl_errors.log
      maxBytes: 10485760  # 10MB
      backupCount: 5
      encoding: utf8

  loggers:
    etl_logger:
      level: DEBUG
      handlers: [console, file, error_file]
      propagate: false

  root:
    level: INFO
    handlers: [console, file]

# ETL Process Configuration
etl:
  # Run ID generation
  run_id:
    prefix: 'ETL'
    timestamp_format: '%Y%m%d%H%M%S'
  
  # Log ID generation
  log_id:
    prefix: 'LOG'
    timestamp_format: '%Y%m%d%H%M%S'
  
  # Status codes
  status_codes:
    success: 'S'
    error: 'E'
    warning: 'W'
    info: 'I'
  
  # Process steps
  steps:
    - INIT
    - EXTRACT
    - TRANSFORM
    - LOAD
    - VALIDATE
    - COMPLETE
    - ERROR
  
  # Logging options
  logging_options:
    log_to_console: true
    log_to_file: true
    log_to_database: false
    console_log_level: INFO
    file_log_level: DEBUG
    max_log_entries_memory: 10000
  
  # Retention policy
  retention:
    log_files_days: 30
    database_logs_days: 90
    archive_old_logs: true

# Application Settings
app:
  name: 'Sales ETL Logger'
  version: '1.0.0'
  environment: 'production'