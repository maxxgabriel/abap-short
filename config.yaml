# ETL Configuration for Sales Data Processing
# Migrated from ABAP ZETL system

# Application metadata
application:
  name: "Sales ETL System"
  version: "1.0.0"
  description: "ETL system for sales data processing migrated from ABAP"

# Spark configuration
spark:
  app_name: "SalesETL"
  master: "local[*]"  # Override in production
  config:
    spark.sql.shuffle.partitions: "200"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"

# Data sources
data_sources:
  raw_sales:
    format: "parquet"  # or jdbc, csv, etc.
    path: "data/raw/sales"
    jdbc:
      url: "jdbc:postgresql://localhost:5432/sales_db"
      driver: "org.postgresql.Driver"
      table: "zsales_raw"
      user: "${DB_USER}"
      password: "${DB_PASSWORD}"
  
  analytics:
    format: "parquet"
    path: "data/analytics/sales"
    jdbc:
      url: "jdbc:postgresql://localhost:5432/sales_db"
      driver: "org.postgresql.Driver"
      table: "zsales_analytics"
      user: "${DB_USER}"
      password: "${DB_PASSWORD}"
  
  etl_log:
    format: "parquet"
    path: "data/logs/etl"
    jdbc:
      url: "jdbc:postgresql://localhost:5432/sales_db"
      driver: "org.postgresql.Driver"
      table: "zetl_log"
      user: "${DB_USER}"
      password: "${DB_PASSWORD}"

# Status codes
status_codes:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# Process steps
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Sale categories
categories:
  high: "HIGH"
  medium: "MEDIUM"
  low: "LOW"

# Business rules
business_rules:
  discount:
    tier1_quantity_threshold: 10
    tier2_quantity_threshold: 15
    tier1_rate: 0.05
    tier2_rate: 0.10
  
  tax:
    rate: 0.08
  
  cost:
    ratio: 0.60
  
  category_thresholds:
    high: 2000.00
    medium: 500.00

# ETL configuration defaults
etl_config:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_jobs: 4
  test_mode: false

# ID prefixes
id_prefixes:
  etl_run: "ETL"
  log: "LOG"
  analytics: "ANL"

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    console:
      enabled: true
    file:
      enabled: true
      path: "logs/etl.log"
      max_bytes: 10485760  # 10MB
      backup_count: 5

# Message templates
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"

# Date format
date_format: "yyyy-MM-dd"
timestamp_format: "yyyy-MM-dd HH:mm:ss"