# ETL Configuration
# Sales Data ETL System Configuration

etl:
  # Process configuration
  process:
    batch_size: 1000
    commit_interval: 500
    retry_attempts: 3
    timeout_seconds: 3600
    parallel_jobs: 1
    
  # Date range configuration
  date_range:
    default_days_back: 7
    max_date_range_days: 365
    
  # ID prefixes
  prefixes:
    etl_run: "ETL"
    log_id: "LOG"
    analytics_id: "ANL"

# Business rules configuration
business_rules:
  # Discount thresholds
  discount:
    tier1:
      quantity_threshold: 10
      discount_rate: 0.05
    tier2:
      quantity_threshold: 15
      discount_rate: 0.10
  
  # Tax configuration
  tax:
    default_rate: 0.08
  
  # Cost and profit
  cost:
    default_ratio: 0.60  # Cost is 60% of unit price
  
  # Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Extraction configuration
extract:
  # Source configuration
  source:
    table: "zsales_raw"
    status_field: "status"
    new_status: "N"
    processed_status: "P"
  
  # Field mapping
  fields:
    - trans_id
    - trans_date
    - customer_id
    - product_id
    - quantity
    - unit_price
    - currency
    - sales_rep
    - region
    - status

# Transformation configuration
transform:
  # Calculation settings
  calculations:
    precision: 2
    rounding_mode: "ROUND_HALF_UP"
  
  # Validation rules
  validation:
    required_fields:
      - trans_id
      - customer_id
      - product_id
      - quantity
      - unit_price
    
    numeric_fields:
      - quantity
      - unit_price
      - gross_amount
      - net_amount
    
    min_values:
      quantity: 1
      unit_price: 0.01
      gross_amount: 0.01

# Load configuration
load:
  # Target configuration
  target:
    table: "zsales_analytics"
    mode: "APPEND"  # APPEND, OVERWRITE, UPSERT
  
  # Validation before load
  validate_before_load: true
  skip_invalid_records: false
  
  # Field mapping
  fields:
    - analytics_id
    - trans_date
    - customer_id
    - product_id
    - total_quantity
    - gross_amount
    - net_amount
    - discount_amount
    - tax_amount
    - currency
    - sales_rep
    - region
    - profit_margin
    - category
    - etl_run_id

# Logging configuration
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: "INFO"
  
  # Log table
  table: "zetl_log"
  
  # Log retention
  retention_days: 90
  
  # Console output
  console_output: true
  
  # Format
  format: "[%(levelname)s] %(asctime)s - %(name)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

# Status codes
status:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# ETL steps
steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Categories
categories:
  high: "HIGH"
  medium: "MEDIUM"
  low: "LOW"

# Error handling
error_handling:
  # Continue on error
  continue_on_error: false
  
  # Maximum errors before stopping
  max_errors: 100
  
  # Error notification
  notify_on_error: true
  
  # Rollback on error
  rollback_on_error: true