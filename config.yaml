# ETL System Configuration

# Database Configuration
database:
  host: localhost
  port: 5432
  database: sales_etl
  username: etl_user
  password: ${DB_PASSWORD}  # Use environment variable
  driver: postgresql
  pool_size: 10
  max_overflow: 20
  pool_timeout: 30
  pool_recycle: 3600

# Spark Configuration
spark:
  app_name: "Sales ETL System"
  master: "local[*]"  # Use local[*] for local mode, yarn for cluster
  executor_memory: "4g"
  driver_memory: "2g"
  executor_cores: 2
  shuffle_partitions: 200
  dynamic_allocation: true
  additional_conf:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.sources.partitionOverwriteMode: "dynamic"
    spark.sql.session.timeZone: "UTC"

# ETL Process Configuration
etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_jobs: 4
  checkpoint_enabled: true
  checkpoint_location: "/tmp/etl_checkpoint"

# Business Rules Configuration
business_rules:
  # Discount thresholds
  discount_qty_tier1: 10
  discount_qty_tier2: 15
  discount_rate_tier1: 0.05
  discount_rate_tier2: 0.10
  
  # Tax rate
  tax_rate: 0.08
  
  # Cost calculation
  cost_ratio: 0.60
  
  # Category thresholds
  category_high_threshold: 2000.00
  category_medium_threshold: 500.00

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_dir: "logs"
  log_file: "etl_process.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5
  console_output: true

# Source and Target Table Names
tables:
  source_raw: "zsales_raw"
  target_analytics: "zsales_analytics"
  etl_log: "zetl_log"

# Data Quality Rules
data_quality:
  null_threshold: 0.05  # 5% null values allowed
  duplicate_check: true
  date_range_check: true
  amount_validation: true
  
# Performance Tuning
performance:
  cache_intermediate_results: true
  broadcast_join_threshold: 10485760  # 10MB
  partition_size_mb: 128
  compression_codec: "snappy"