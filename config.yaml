# PySpark ETL Configuration
# Migrated from ABAP Sales ETL System

app:
  name: "sales_etl_framework"
  version: "1.0.0"
  description: "Shared framework components for ETL operations"

spark:
  app_name: "SalesETLFramework"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: 200
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.serializer: "org.apache.spark.serializer.KryoSerializer"

database:
  source:
    jdbc_url: "jdbc:postgresql://localhost:5432/sales_source"
    driver: "org.postgresql.Driver"
    user: "${DB_SOURCE_USER}"
    password: "${DB_SOURCE_PASSWORD}"
    connection_properties:
      fetchsize: 10000
      batchsize: 1000
  
  target:
    jdbc_url: "jdbc:postgresql://localhost:5432/sales_analytics"
    driver: "org.postgresql.Driver"
    user: "${DB_TARGET_USER}"
    password: "${DB_TARGET_PASSWORD}"
    connection_properties:
      batchsize: 1000
      isolationLevel: "READ_COMMITTED"

etl:
  processing:
    batch_size: 1000
    commit_interval: 500
    retry_attempts: 3
    timeout_seconds: 3600
    parallel_jobs: 4
  
  business_rules:
    discount:
      tier1_quantity_threshold: 10
      tier1_rate: 0.05
      tier2_quantity_threshold: 15
      tier2_rate: 0.10
    tax:
      rate: 0.08
    cost:
      ratio: 0.60
    category:
      high_threshold: 2000.00
      medium_threshold: 500.00

  status_codes:
    new: "N"
    processed: "P"
    error: "E"
    warning: "W"
    success: "S"
    info: "I"

  process_steps:
    init: "INIT"
    extract: "EXTRACT"
    transform: "TRANSFORM"
    load: "LOAD"
    validate: "VALIDATE"
    complete: "COMPLETE"
    error: "ERROR"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  handlers:
    console:
      enabled: true
      level: "INFO"
    file:
      enabled: true
      level: "DEBUG"
      filename: "logs/etl_{run_id}.log"
      max_bytes: 10485760  # 10MB
      backup_count: 5
    database:
      enabled: true
      table: "etl_log"
      batch_size: 100

monitoring:
  metrics:
    enabled: true
    interval_seconds: 60
  alerts:
    enabled: true
    error_threshold: 100
    warning_threshold: 50