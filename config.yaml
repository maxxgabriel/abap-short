# ETL Configuration File
# Converted from ABAP ETL system configuration

# Spark Configuration
spark:
  app_name: "Sales ETL System"
  master: "local[*]"  # Change to yarn or cluster mode for production
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"
    spark.sql.legacy.timeParserPolicy: "LEGACY"

# Data Source Configuration
data_sources:
  raw_sales:
    format: "parquet"  # Change to jdbc, csv, etc. as needed
    path: "data/raw/sales"
    options:
      header: "true"
      inferSchema: "false"  # Use explicit schema
  
  analytics:
    format: "parquet"
    path: "data/analytics/sales"
    mode: "overwrite"  # append, overwrite, ignore, error
    partition_by:
      - "trans_date"
      - "region"

# ETL Configuration
etl:
  batch_size: 1000
  commit_interval: 500
  parallel_jobs: 4
  retry_attempts: 3
  timeout_seconds: 3600
  
  # Date range for extraction (defaults)
  date_range:
    from_days_ago: 7
    to_days_ago: 0

# Business Rules
business_rules:
  discount:
    qty_tier1: 10
    qty_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10
  
  tax:
    rate: 0.08
  
  cost:
    ratio: 0.60
  
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "parquet"
  path: "data/logs/etl"
  console_output: true
  file_output: true

# Test Mode
test_mode:
  enabled: false
  sample_size: 100
  mock_data: false

# ID Prefixes
id_prefixes:
  etl_run: "ETL"
  log_id: "LOG"
  analytics_id: "ANL"

# Status Codes
status_codes:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# Process Steps
process_steps:
  - "INIT"
  - "EXTRACT"
  - "TRANSFORM"
  - "LOAD"
  - "VALIDATE"
  - "COMPLETE"

# Categories
categories:
  - "HIGH"
  - "MEDIUM"
  - "LOW"

# Database Configuration (if using JDBC)
database:
  jdbc_url: "jdbc:postgresql://localhost:5432/etl_db"
  driver: "org.postgresql.Driver"
  user: "${DB_USER:etl_user}"
  password: "${DB_PASSWORD:changeme}"
  connection_properties:
    ssl: "false"
    applicationName: "SalesETL"

# Table Names
tables:
  raw_sales: "zsales_raw"
  analytics: "zsales_analytics"
  etl_log: "zetl_log"