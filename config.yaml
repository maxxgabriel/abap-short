# ETL Integration Test Configuration

etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_jobs: 4

test_data:
  raw_sales_count: 100
  date_range_days: 30
  currencies:
    - USD
    - EUR
    - GBP
  regions:
    - NORTH
    - SOUTH
    - EAST
    - WEST
  
business_rules:
  discount:
    tier1_quantity: 10
    tier1_rate: 0.05
    tier2_quantity: 15
    tier2_rate: 0.10
  tax_rate: 0.08
  cost_ratio: 0.60
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

logging:
  level: INFO
  console: true
  file: true
  log_path: logs/etl_integration_tests.log

spark:
  app_name: ETL_Integration_Tests
  master: local[*]
  config:
    spark.sql.shuffle.partitions: 4
    spark.driver.memory: 2g
    spark.executor.memory: 2g

database:
  raw_table: raw_sales
  analytics_table: sales_analytics
  log_table: etl_logs