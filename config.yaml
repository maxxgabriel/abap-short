# Sales ETL System Configuration
# Migrated from ABAP Package $ZETL

etl:
  # ETL Run Configuration
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_jobs: 4

  # Date Range Configuration
  default_days_back: 7
  
  # Execution Mode
  test_mode: false
  enable_logging: true

# Business Rules Configuration
business_rules:
  # Discount Thresholds
  discount:
    tier1_quantity: 10
    tier2_quantity: 15
    tier1_rate: 0.05
    tier2_rate: 0.10
  
  # Tax Configuration
  tax_rate: 0.08
  
  # Cost Configuration
  cost_ratio: 0.60
  
  # Category Thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Database Configuration
database:
  # Source Table
  source:
    table_name: "zsales_raw"
    database: "sales_db"
    
  # Target Table
  target:
    table_name: "zsales_analytics"
    database: "analytics_db"
    
  # Log Table
  log:
    table_name: "zetl_log"
    database: "etl_db"

# Spark Configuration
spark:
  app_name: "Sales ETL Process"
  master: "local[*]"
  executor_memory: "4g"
  driver_memory: "2g"
  shuffle_partitions: 200
  
  # Optimization Settings
  adaptive_query_execution: true
  dynamic_partition_overwrite: true
  
# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl_process.log"
  console: true
  
# Status Codes
status_codes:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# Process Steps
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Message Templates
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"