# ETL Configuration File
# This file contains parameterized values for the ETL system
# All values can be overridden at runtime or per environment

# Environment settings
environment: development

# Spark Configuration
spark:
  app_name: "Sales ETL System"
  master: "local[*]"
  driver_memory: "4g"
  executor_memory: "4g"
  executor_cores: 4
  shuffle_partitions: 200
  
# Data sources
data_sources:
  raw_sales:
    format: "parquet"
    path: "data/raw/sales"
    schema_validation: true
    
  analytics_output:
    format: "parquet"
    path: "data/analytics/sales"
    mode: "overwrite"  # append, overwrite, error
    partition_by: ["trans_date"]
    
  etl_log:
    format: "parquet"
    path: "data/logs/etl"
    mode: "append"

# Business Rules - can override defaults from config.py
business_rules:
  # Discount configuration
  discount:
    qty_tier1: 10
    qty_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10
    
  # Tax configuration
  tax:
    rate: 0.08
    
  # Cost configuration
  cost:
    ratio: 0.60
    
  # Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# ETL Processing Configuration
etl:
  # Batch processing
  batch_size: 1000
  commit_interval: 500
  
  # Retry configuration
  retry_attempts: 3
  retry_delay_seconds: 5
  
  # Timeout configuration
  timeout_seconds: 3600
  
  # Parallel processing
  parallel_jobs: 4
  
  # Data quality
  enable_validation: true
  fail_on_validation_error: false
  
  # Logging
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  enable_console_output: true
  enable_file_output: true

# Data Quality Rules
data_quality:
  required_fields:
    - trans_id
    - trans_date
    - customer_id
    - product_id
    - quantity
    - unit_price
    - currency
    
  validation_rules:
    quantity:
      min: 1
      max: 10000
      
    unit_price:
      min: 0.01
      max: 999999.99
      
    currency:
      allowed_values: ["USD", "EUR", "GBP"]
      
  # Thresholds for data quality alerts
  quality_thresholds:
    max_error_rate: 0.05  # 5%
    max_null_rate: 0.02   # 2%

# ID Generation
id_generation:
  prefixes:
    etl_run: "ETL"
    log_id: "LOG"
    analytics_id: "ANL"
    
  # Timestamp format for ID generation
  timestamp_format: "%Y%m%d%H%M%S"

# Monitoring and Alerting
monitoring:
  enable_metrics: true
  metrics_path: "data/metrics"
  
  # Performance thresholds
  performance:
    max_extraction_time_minutes: 30
    max_transformation_time_minutes: 60
    max_load_time_minutes: 30
    
  # Alert configuration
  alerts:
    enabled: false
    email_recipients: []
    slack_webhook: ""

# Testing Configuration
testing:
  test_mode: false
  sample_data_size: 100
  enable_data_profiling: false

# Logging Configuration
logging:
  version: 1
  disable_existing_loggers: false
  
  formatters:
    standard:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    detailed:
      format: "%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s"
      
  handlers:
    console:
      class: "logging.StreamHandler"
      level: "INFO"
      formatter: "standard"
      stream: "ext://sys.stdout"
      
    file:
      class: "logging.handlers.RotatingFileHandler"
      level: "DEBUG"
      formatter: "detailed"
      filename: "logs/etl.log"
      maxBytes: 10485760  # 10MB
      backupCount: 5
      
  root:
    level: "INFO"
    handlers: ["console", "file"]