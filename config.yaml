# ETL Logging System Configuration

logging:
  # Log format configuration
  format:
    structured: true  # Use JSON structured logging
    include_correlation: true  # Include correlation IDs
    
  # Output configuration
  console:
    enabled: true
    level: INFO
    
  file:
    enabled: true
    path: "logs/etl_{etl_run_id}.log"
    level: DEBUG
    max_bytes: 10485760  # 10MB
    backup_count: 5
    
  # Log rotation
  rotation:
    when: "midnight"
    interval: 1
    backup_count: 30

# ABAP status code mapping
status_mapping:
  S: INFO     # Success
  I: INFO     # Info
  W: WARNING  # Warning
  E: ERROR    # Error
  N: INFO     # New

# ETL process steps
process_steps:
  - INIT
  - EXTRACT
  - TRANSFORM
  - LOAD
  - VALIDATE
  - COMPLETE
  - ERROR

# Correlation tracking
correlation:
  generate_uuid: true
  propagate_to_spark: true
  include_in_metrics: true

# Performance monitoring
monitoring:
  log_execution_time: true
  log_memory_usage: true
  log_record_counts: true
  
# Error handling
error_handling:
  max_retries: 3
  retry_delay_seconds: 5
  log_stack_trace: true

# Batch processing
batch:
  log_interval: 1000  # Log progress every N records
  commit_interval: 500