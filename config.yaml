# ETL Logger Configuration
etl_logger:
  # Enable console logging
  enable_console: true
  
  # Log persistence settings
  persistence:
    # Base path for log storage
    log_table_path: "s3://etl-logs/sales_etl/"
    
    # Write mode: append or overwrite
    write_mode: "append"
    
    # Storage format: parquet, delta, or csv
    format: "parquet"
    
    # Partition columns for log storage
    partition_by:
      - "execution_date"
      - "process_step"
  
  # ETL run ID settings
  run_id:
    prefix: "ETL"
    auto_generate: true

# ETL Process Configuration
etl_process:
  # Status codes
  status:
    success: "S"
    error: "E"
    warning: "W"
    info: "I"
  
  # Process steps
  steps:
    init: "INIT"
    extract: "EXTRACT"
    transform: "TRANSFORM"
    load: "LOAD"
    validate: "VALIDATE"
    complete: "COMPLETE"
    error: "ERROR"
  
  # Processing configuration
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600

# Business Rules (from ABAP constants)
business_rules:
  # Discount thresholds
  discount:
    quantity_tier1: 10
    quantity_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10
  
  # Tax rate
  tax_rate: 0.08
  
  # Cost ratio
  cost_ratio: 0.60
  
  # Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Spark Configuration
spark:
  app_name: "Sales ETL Logger"
  master: "local[*]"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"

# Storage Paths
storage:
  # Raw data source
  raw_data_path: "s3://etl-data/raw/sales/"
  
  # Analytics target
  analytics_path: "s3://etl-data/analytics/sales/"
  
  # Checkpoint location
  checkpoint_path: "s3://etl-data/checkpoints/"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - [%(levelname)s] - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"