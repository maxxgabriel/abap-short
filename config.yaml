# ETL Logger Configuration
# Migrated from ABAP ETL system configuration

# Logging Configuration
logging:
  log_level: INFO
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_output_path: "/data/etl_logs"
  log_write_mode: "append"
  enable_console_logging: true

# Spark Configuration
spark:
  app_name: "ETL_Logger"
  master: "local[*]"
  log_level: "WARN"
  
  # Spark SQL settings
  sql:
    shuffle_partitions: 200
    adaptive_enabled: true
    
  # Memory settings
  executor:
    memory: "4g"
    cores: 2
  driver:
    memory: "2g"

# ETL Process Configuration
etl:
  # Batch processing
  default_batch_size: 1000
  default_commit_interval: 500
  
  # Retry settings
  default_retry_attempts: 3
  default_timeout_seconds: 3600
  
  # ID prefixes (matching ABAP constants)
  prefix_etl_run: "ETL"
  prefix_log_id: "LOG"
  prefix_analytics_id: "ANL"

# Business Rules (from ABAP constants)
business_rules:
  # Discount thresholds
  discount_qty_tier1: 10
  discount_qty_tier2: 15
  discount_rate_tier1: 0.05
  discount_rate_tier2: 0.10
  
  # Tax rate
  tax_rate: 0.08
  
  # Cost ratio
  cost_ratio: 0.60
  
  # Category thresholds
  category_high_threshold: 2000.00
  category_medium_threshold: 500.00

# Storage Paths
storage:
  raw_data_path: "/data/raw/sales"
  analytics_data_path: "/data/analytics/sales"
  log_data_path: "/data/logs/etl"
  checkpoint_path: "/data/checkpoints"

# Status Codes (matching ABAP)
status_codes:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# Process Steps (matching ABAP)
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Category Codes (matching ABAP)
categories:
  high: "HIGH"
  medium: "MEDIUM"
  low: "LOW"