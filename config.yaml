# ETL Configuration File
# Sales Data ETL System Configuration

# Database Configuration
database:
  source:
    host: localhost
    port: 5432
    database: sales_source
    schema: public
    table: zsales_raw
  
  target:
    host: localhost
    port: 5432
    database: sales_analytics
    schema: public
    table: zsales_analytics
  
  log:
    host: localhost
    port: 5432
    database: sales_etl
    schema: public
    table: zetl_log

# Spark Configuration
spark:
  app_name: "Sales ETL Pipeline"
  master: "local[*]"
  driver_memory: "2g"
  executor_memory: "4g"
  executor_cores: 2
  log_level: "WARN"
  
  # Spark SQL settings
  sql:
    shuffle_partitions: 200
    adaptive_enabled: true
    
  # Catalog settings (if using Delta Lake or Iceberg)
  catalog:
    type: "hive"  # Options: hive, delta, iceberg
    warehouse_dir: "/user/hive/warehouse"

# ETL Processing Configuration
etl:
  batch_size: 1000
  commit_interval: 500
  parallel_jobs: 4
  retry_attempts: 3
  timeout_seconds: 3600
  test_mode: false
  
  # Date range defaults
  default_lookback_days: 7
  
  # Error handling
  error_handling:
    max_errors_per_batch: 10
    continue_on_error: true
    error_threshold_percent: 5.0

# Business Rules
business_rules:
  discount:
    tier1_quantity: 10
    tier1_rate: 0.05
    tier2_quantity: 15
    tier2_rate: 0.10
  
  tax:
    rate: 0.08
  
  cost:
    ratio: 0.60
  
  categories:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Logging Configuration
logging:
  level: INFO  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # File logging
  file:
    enabled: true
    path: "logs/etl_execution.log"
    max_bytes: 10485760  # 10MB
    backup_count: 5
  
  # Console logging
  console:
    enabled: true
    colored: true

# Data Quality Checks
data_quality:
  enabled: true
  
  validation_rules:
    - field: trans_id
      type: not_null
      required: true
    
    - field: customer_id
      type: not_null
      required: true
    
    - field: product_id
      type: not_null
      required: true
    
    - field: quantity
      type: range
      min: 1
      max: 10000
    
    - field: unit_price
      type: range
      min: 0.01
      max: 999999.99
    
    - field: currency
      type: in_list
      values: ["USD", "EUR", "GBP", "JPY"]
  
  # Duplicate detection
  duplicate_check:
    enabled: true
    key_fields: ["trans_id"]

# Performance Tuning
performance:
  # Caching
  cache_enabled: true
  cache_intermediate_results: true
  
  # Partitioning
  partition_columns: ["trans_date", "region"]
  num_partitions: 10
  
  # Broadcast join threshold (in bytes)
  broadcast_threshold: 10485760  # 10MB
  
  # Compression
  compression_codec: "snappy"  # Options: none, snappy, gzip, lz4

# Monitoring and Alerting
monitoring:
  enabled: true
  
  # Metrics collection
  metrics:
    enabled: true
    interval_seconds: 60
  
  # Health checks
  health_check:
    enabled: true
    interval_seconds: 300
  
  # Alerting thresholds
  alerts:
    error_rate_threshold: 5.0  # percent
    duration_threshold_seconds: 7200
    memory_threshold_percent: 90

# Runtime Environment
environment:
  name: "development"  # Options: development, staging, production
  timezone: "UTC"
  locale: "en_US"