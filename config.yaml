# ETL System Configuration

# Spark Configuration
spark:
  app_name: "Sales_ETL_System"
  master: "local[*]"
  enable_hive_support: false
  log_level: "WARN"
  configs:
    spark.sql.shuffle.partitions: "200"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.driver.memory: "4g"
    spark.executor.memory: "4g"
    spark.executor.cores: "2"
    spark.default.parallelism: "100"
    spark.sql.sources.partitionOverwriteMode: "dynamic"

# Database Configuration
database:
  jdbc:
    driver: "org.postgresql.Driver"
    host: "localhost"
    port: 5432
    database: "etl_db"
    user: "etl_user"
    password: "${DB_PASSWORD}"  # Use environment variable
    connection_pool:
      max_connections: 10
      min_connections: 2
      fetch_size: 1000
      connection_timeout: 30000
  
  tables:
    source: "sales_raw"
    target: "sales_analytics"
    log: "etl_log"

# ETL Processing Configuration
etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_jobs: 4
  
  # Date range for processing
  default_lookback_days: 7
  
  # Status codes
  status:
    new: "N"
    processed: "P"
    error: "E"
    warning: "W"
    success: "S"

# Business Rules Configuration
business_rules:
  # Discount rules
  discount:
    tier1_quantity: 10
    tier2_quantity: 15
    tier1_rate: 0.05
    tier2_rate: 0.10
  
  # Tax configuration
  tax_rate: 0.08
  
  # Cost calculation
  cost_ratio: 0.60
  
  # Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Logging Configuration
logging:
  level: "INFO"
  log_dir: "logs"
  console_output: true
  file_output: true
  structured_logging: true
  
  # Log rotation
  rotation:
    max_bytes: 10485760  # 10 MB
    backup_count: 5

# Data Quality Configuration
data_quality:
  validation_enabled: true
  validation_rules:
    - field: "customer_id"
      rule: "not_null"
    - field: "product_id"
      rule: "not_null"
    - field: "quantity"
      rule: "greater_than"
      value: 0
    - field: "unit_price"
      rule: "greater_than"
      value: 0
    - field: "gross_amount"
      rule: "greater_than"
      value: 0
    - field: "currency"
      rule: "not_null"
    - field: "category"
      rule: "in_list"
      values: ["HIGH", "MEDIUM", "LOW"]

# Performance Configuration
performance:
  enable_caching: true
  cache_storage_level: "MEMORY_AND_DISK"
  broadcast_threshold: 10485760  # 10 MB
  shuffle_partitions: 200

# Monitoring Configuration
monitoring:
  metrics_enabled: true
  metrics_interval_seconds: 60
  health_check_enabled: true