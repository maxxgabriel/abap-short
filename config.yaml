# ETL Configuration File
# Environment-specific settings for Sales Data ETL

common:
  # Logging configuration
  logging:
    directory: "logs"
    level: "INFO"
    
  # Business rules (shared across environments)
  business_rules:
    discount_qty_tier1: 10
    discount_qty_tier2: 15
    discount_rate_tier1: 0.05
    discount_rate_tier2: 0.10
    tax_rate: 0.08
    cost_ratio: 0.60
    category_high_threshold: 2000.00
    category_medium_threshold: 500.00
  
  # ETL processing defaults
  processing:
    batch_size: 1000
    commit_interval: 500
    retry_attempts: 3
    timeout_seconds: 3600

development:
  # Spark configuration for development
  spark:
    app_name: "SalesETL-Dev"
    master: "local[*]"
    executor_memory: "2g"
    driver_memory: "2g"
    log_level: "INFO"
    
  # Source configuration
  source:
    table: "dev_zsales_raw"
    status_filter: "N"
    
  # Target configuration
  target:
    table: "dev_zsales_analytics"
    write_mode: "overwrite"  # Use overwrite in dev
    
  # Feature flags
  features:
    test_mode: true
    enable_profiling: true

qa:
  # Spark configuration for QA
  spark:
    app_name: "SalesETL-QA"
    master: "yarn"
    executor_memory: "4g"
    driver_memory: "4g"
    executor_cores: 2
    num_executors: 4
    log_level: "INFO"
    
  # Source configuration
  source:
    table: "qa_zsales_raw"
    status_filter: "N"
    
  # Target configuration
  target:
    table: "qa_zsales_analytics"
    write_mode: "append"
    
  # Feature flags
  features:
    test_mode: false
    enable_profiling: true

production:
  # Spark configuration for production
  spark:
    app_name: "SalesETL-Prod"
    master: "yarn"
    executor_memory: "8g"
    driver_memory: "8g"
    executor_cores: 4
    num_executors: 10
    log_level: "WARN"
    dynamic_allocation: true
    shuffle_partitions: 200
    
  # Source configuration
  source:
    table: "zsales_raw"
    status_filter: "N"
    
  # Target configuration
  target:
    table: "zsales_analytics"
    write_mode: "append"
    partition_columns:
      - "trans_date"
    
  # Feature flags
  features:
    test_mode: false
    enable_profiling: false
    
  # Production-specific settings
  processing:
    batch_size: 5000
    commit_interval: 2500
    retry_attempts: 5
    timeout_seconds: 7200