# ETL Logger Configuration
# Configuration for logging and ETL process parameters

logging:
  # Python logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: INFO
  
  # Whether to persist logs to storage (Delta Lake)
  persist_to_storage: true
  
  # Log storage location
  log_storage_path: /mnt/etl/logs
  
  # Log retention period (days)
  retention_days: 90
  
  # Console logging format
  console_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # File logging (optional)
  file_logging:
    enabled: false
    path: /var/log/etl
    max_bytes: 10485760  # 10MB
    backup_count: 5

etl:
  # ETL run ID prefix
  run_id_prefix: ETL
  
  # Default batch size for processing
  default_batch_size: 1000
  
  # Commit interval for database operations
  commit_interval: 500
  
  # Number of retry attempts for failed operations
  retry_attempts: 3
  
  # Timeout in seconds
  timeout_seconds: 3600
  
  # Enable test mode (no actual data commits)
  test_mode: false

business_rules:
  # Discount thresholds
  discount:
    tier1_quantity: 10
    tier1_rate: 0.05
    tier2_quantity: 15
    tier2_rate: 0.10
  
  # Tax rate
  tax_rate: 0.08
  
  # Cost ratio for profit calculation
  cost_ratio: 0.60
  
  # Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

status_codes:
  new: 'N'
  processed: 'P'
  error: 'E'
  warning: 'W'
  success: 'S'
  info: 'I'

spark:
  # Spark configuration
  app_name: SalesETL
  master: local[*]  # Change to yarn for cluster mode
  
  # Spark SQL settings
  sql:
    shuffle_partitions: 200
    adaptive_enabled: true
  
  # Delta Lake settings
  delta:
    enable_change_data_feed: true
    log_retention_duration: "interval 30 days"