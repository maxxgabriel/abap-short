# ETL Configuration File
# Converted from ABAP Constants (ZCL_ETL_CONSTANTS)

# Status Codes
status_codes:
  new: 'N'
  processed: 'P'
  error: 'E'
  warning: 'W'
  success: 'S'
  info: 'I'

# ETL Process Steps
process_steps:
  init: 'INIT'
  extract: 'EXTRACT'
  transform: 'TRANSFORM'
  load: 'LOAD'
  validate: 'VALIDATE'
  complete: 'COMPLETE'
  error: 'ERROR'

# Sale Categories
categories:
  high: 'HIGH'
  medium: 'MEDIUM'
  low: 'LOW'

# Business Rules - Discount Thresholds
discount:
  quantity_tier1: 10
  quantity_tier2: 15
  rate_tier1: 0.05
  rate_tier2: 0.10

# Business Rules - Tax Rate
tax:
  rate: 0.08

# Business Rules - Cost Ratio
cost:
  ratio: 0.60

# Business Rules - Category Thresholds
category_thresholds:
  high: 2000.00
  medium: 500.00

# ETL Configuration Defaults
etl_config:
  default_batch_size: 1000
  default_commit_interval: 500
  default_retry_attempts: 3
  default_timeout_seconds: 3600
  parallel_jobs: 4

# ID Prefixes
id_prefixes:
  etl_run: 'ETL'
  log: 'LOG'
  analytics: 'ANL'

# Message Texts
messages:
  init_success: 'ETL process initialized successfully'
  extract_start: 'Starting data extraction'
  extract_complete: 'Data extraction completed'
  transform_start: 'Starting data transformation'
  transform_complete: 'Data transformation completed'
  load_start: 'Starting data load'
  load_complete: 'Data load completed'
  etl_complete: 'ETL process completed successfully'
  etl_error: 'ETL process failed'

# Logging Configuration
logging:
  level: 'INFO'
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  date_format: '%Y-%m-%d %H:%M:%S'
  
# Database Configuration (placeholder)
database:
  connection_timeout: 30
  query_timeout: 300
  max_retries: 3