# ETL Logger Configuration
# Configuration for ETL logging and persistence

# Logging settings
logging:
  # Path to persist log entries (Delta table format)
  log_table_path: "/mnt/etl/logs/etl_log_table"
  
  # Console logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  console_log_level: "INFO"
  
  # Enable DataFrame persistence
  enable_persistence: true
  
  # Write mode for log persistence (append, overwrite)
  write_mode: "append"

# ETL Run settings
etl_run:
  # Prefix for ETL run IDs
  run_id_prefix: "ETL"
  
  # Prefix for log entry IDs
  log_id_prefix: "LOG"

# Status codes (matching ABAP constants)
status_codes:
  success: "S"
  error: "E"
  warning: "W"
  info: "I"

# Process steps (matching ABAP constants)
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Performance settings
performance:
  # Batch size for log persistence
  log_batch_size: 1000
  
  # Auto-persist interval (number of logs before auto-persist)
  auto_persist_threshold: 100

# Storage format options
storage:
  # Format for log persistence (delta, parquet, json)
  format: "delta"
  
  # Partitioning columns for log table
  partition_by:
    - "execution_date"
    - "etl_run_id"
  
  # Compression codec (snappy, gzip, lz4, none)
  compression: "snappy"

# Retention settings
retention:
  # Enable log retention policy
  enable_retention: true
  
  # Days to retain logs
  retention_days: 90
  
  # Archive old logs instead of deleting
  enable_archive: true
  
  # Archive path
  archive_path: "/mnt/etl/logs/archive"

# Message templates
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"