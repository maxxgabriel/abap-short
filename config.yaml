# ETL Configuration File
# Sales Data ETL System

# Application Settings
application:
  name: "Sales ETL System"
  version: "1.0.0"
  environment: "production"

# Spark Configuration
spark:
  app_name: "SalesETL"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: 200
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.driver.memory: "4g"
    spark.executor.memory: "4g"

# Database Configuration
database:
  raw_table: "zsales_raw"
  analytics_table: "zsales_analytics"
  log_table: "zetl_log"
  jdbc_url: "jdbc:postgresql://localhost:5432/etl_db"
  driver: "org.postgresql.Driver"
  connection_properties:
    user: "etl_user"
    password: "${DB_PASSWORD}"

# ETL Process Configuration
etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_jobs: 4
  
  # Date range defaults
  default_lookback_days: 7
  
  # Status codes
  status:
    new: "N"
    processed: "P"
    error: "E"
    warning: "W"
    success: "S"
    info: "I"

# Business Rules
business_rules:
  # Discount configuration
  discount:
    tier1:
      quantity_threshold: 10
      rate: 0.05
    tier2:
      quantity_threshold: 15
      rate: 0.10
  
  # Tax configuration
  tax:
    rate: 0.08
  
  # Cost calculation
  cost:
    ratio: 0.60
  
  # Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00
    categories:
      - "HIGH"
      - "MEDIUM"
      - "LOW"

# Validation Rules
validation:
  required_fields:
    raw_sales:
      - trans_id
      - trans_date
      - customer_id
      - product_id
      - quantity
      - unit_price
      - currency
    
    analytics:
      - analytics_id
      - customer_id
      - product_id
      - gross_amount
      - currency
      - category
  
  currency_codes:
    - "USD"
    - "EUR"
    - "GBP"
    - "JPY"
  
  numeric_ranges:
    quantity:
      min: 1
      max: 10000
    unit_price:
      min: 0.01
      max: 1000000.00

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Log file configuration
  file:
    enabled: true
    path: "logs/etl_{date}.log"
    max_size_mb: 100
    backup_count: 10
  
  # Database logging
  database_logging:
    enabled: true
    batch_size: 100

# ID Generation
id_generation:
  prefixes:
    etl_run: "ETL"
    log: "LOG"
    analytics: "ANL"
  
  format: "{prefix}{timestamp}"

# Error Handling
error_handling:
  continue_on_error: false
  error_threshold_percent: 5
  send_alerts: true
  alert_email: "etl-admin@example.com"

# Performance Monitoring
monitoring:
  enabled: true
  metrics:
    - records_processed
    - records_success
    - records_error
    - execution_time
    - memory_usage
  
  thresholds:
    max_execution_minutes: 60
    min_success_rate_percent: 95