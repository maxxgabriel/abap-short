# ETL Framework Configuration
# Sales Data Processing System

# Spark Configuration
spark:
  app_name: "SalesETLProcess"
  master: "local[*]"  # Use local[*] for local mode, or yarn/spark://host:port for cluster
  config:
    spark.sql.shuffle.partitions: 200
    spark.default.parallelism: 100
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"
    spark.executor.cores: 4
    spark.sql.sources.partitionOverwriteMode: "dynamic"

# Database Configuration
database:
  host: "localhost"
  port: 5432
  database: "sales_etl"
  username: "etl_user"
  password: "${DB_PASSWORD}"  # Use environment variable
  driver: "org.postgresql.Driver"
  schema: "public"
  
  # Connection Pool Settings
  connection_pool:
    max_connections: 10
    min_connections: 2
    connection_timeout: 30000
    idle_timeout: 600000
  
  # SSL Configuration
  ssl: false
  ssl_mode: "require"
  
  # Table Names
  tables:
    raw_sales: "zsales_raw"
    analytics: "zsales_analytics"
    etl_log: "zetl_log"

# ETL Configuration
etl:
  # Processing Parameters
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  
  # Parallel Processing
  parallel_jobs: 4
  partition_column: "trans_date"
  
  # Status Codes
  status_codes:
    new: "N"
    processed: "P"
    error: "E"
    warning: "W"
    success: "S"
    info: "I"
  
  # Process Steps
  steps:
    init: "INIT"
    extract: "EXTRACT"
    transform: "TRANSFORM"
    load: "LOAD"
    validate: "VALIDATE"
    complete: "COMPLETE"
    error: "ERROR"
  
  # Business Rules
  business_rules:
    # Discount Rules
    discount:
      tier1_quantity: 10
      tier1_rate: 0.05
      tier2_quantity: 15
      tier2_rate: 0.10
    
    # Tax Rules
    tax:
      rate: 0.08
    
    # Cost Calculation
    cost:
      ratio: 0.60
    
    # Category Thresholds
    categories:
      high_threshold: 2000.00
      medium_threshold: 500.00
      labels:
        high: "HIGH"
        medium: "MEDIUM"
        low: "LOW"
  
  # ID Prefixes
  id_prefixes:
    etl_run: "ETL"
    log: "LOG"
    analytics: "ANL"
  
  # Data Quality Rules
  data_quality:
    required_fields:
      - customer_id
      - product_id
      - quantity
      - unit_price
    
    validation_rules:
      quantity_min: 1
      unit_price_min: 0.01
      gross_amount_min: 0.01

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  directory: "logs"
  enable_console: true
  enable_file: true
  
  # Log Rotation
  max_bytes: 10485760  # 10MB
  backup_count: 5
  
  # Log Format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

# Error Handling
error_handling:
  # Continue processing on errors
  continue_on_error: false
  
  # Maximum errors before stopping
  max_errors: 100
  
  # Error notification
  enable_alerts: false
  alert_email: "etl-admin@company.com"
  
  # Dead Letter Queue
  dead_letter_table: "etl_errors"

# Performance Tuning
performance:
  # Cache intermediate results
  cache_enabled: true
  
  # Broadcast join threshold (bytes)
  broadcast_threshold: 10485760  # 10MB
  
  # Shuffle partitions
  shuffle_partitions: 200
  
  # Adaptive query execution
  adaptive_enabled: true

# Monitoring
monitoring:
  # Enable metrics collection
  enable_metrics: true
  
  # Metrics storage
  metrics_table: "etl_metrics"
  
  # Performance thresholds
  thresholds:
    max_duration_seconds: 7200  # 2 hours
    min_throughput_records_per_second: 100

# Environment-specific overrides
environments:
  development:
    database:
      host: "localhost"
    spark:
      master: "local[*]"
    logging:
      level: "DEBUG"
  
  production:
    database:
      host: "prod-db-host"
    spark:
      master: "yarn"
    logging:
      level: "INFO"
    error_handling:
      enable_alerts: true