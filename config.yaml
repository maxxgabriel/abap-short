# ETL Logger Configuration

# Logging Configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console_output: true
  file_output: false
  log_file_path: "logs/etl.log"

# Database Configuration
database:
  log_table_name: "etl_log"
  write_mode: "append"
  enable_table_logging: false

# ETL Run Configuration
etl_run:
  generate_run_id: true
  id_prefix: "ETL"
  timestamp_format: "%Y%m%d%H%M%S%f"

# Log Entry Configuration
log_entry:
  id_prefix: "LOG"
  include_duration: true
  track_step_timing: true
  max_message_length: 255

# Status Codes
status_codes:
  success: "S"
  error: "E"
  warning: "W"
  info: "I"

# Process Steps
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Performance Configuration
performance:
  batch_log_size: 1000
  enable_statistics: true
  console_output_delay_ms: 0

# Message Templates
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"