# ETL Configuration File
# SAP Sales Data Migration to PySpark

# Source Configuration
source_type: jdbc  # Options: jdbc, delta, parquet

# JDBC Configuration for SAP Connection
jdbc:
  url: "jdbc:sap://hostname:port/?databaseName=SAPDB"
  driver: "com.sap.db.jdbc.Driver"
  user: "${SAP_USER}"  # Use environment variable
  password: "${SAP_PASSWORD}"  # Use environment variable
  source_table: "ZSALES_RAW"
  target_table: "ZSALES_ANALYTICS"
  fetch_size: 1000
  batch_size: 500
  properties:
    # Additional JDBC properties
    connectTimeout: "60000"
    socketTimeout: "60000"

# Delta Lake Configuration (Alternative Source/Target)
delta:
  source_path: "s3://data-lake/raw/sales/"
  target_path: "s3://data-lake/analytics/sales/"

# Parquet Configuration (Alternative Source/Target)
parquet:
  source_path: "s3://data-lake/raw/sales_parquet/"
  target_path: "s3://data-lake/analytics/sales_parquet/"
  partition_by:
    - trans_date

# Target Configuration
target_type: jdbc  # Options: jdbc, delta, parquet

# Business Rules Configuration
business_rules:
  # Discount thresholds and rates
  discount_qty_tier1: 10
  discount_qty_tier2: 15
  discount_rate_tier1: 0.05  # 5%
  discount_rate_tier2: 0.10  # 10%
  
  # Tax configuration
  tax_rate: 0.08  # 8%
  
  # Cost calculation
  cost_ratio: 0.60  # 60% of unit price
  
  # Category thresholds
  category_high_threshold: 2000.00
  category_medium_threshold: 500.00

# ETL Process Configuration
etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_partitions: 4

# Logging Configuration
logging:
  level: INFO  # Options: DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl_${date}.log"

# Spark Configuration
spark:
  app_name: "SAP_Sales_ETL"
  master: "local[*]"  # Update for cluster deployment
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.serializer: "org.apache.spark.serializer.KryoSerializer"
    spark.sql.sources.partitionOverwriteMode: "dynamic"
    # Memory configurations
    spark.driver.memory: "4g"
    spark.executor.memory: "8g"
    spark.executor.cores: "4"
    # Network configurations
    spark.network.timeout: "800s"
    spark.executor.heartbeatInterval: "60s"

# Security Configuration
security:
  encryption_enabled: true
  credential_provider: "environment"  # Options: environment, vault, aws_secrets

# Monitoring Configuration
monitoring:
  metrics_enabled: true
  stats_collection: true
  performance_logging: true