# ETL Component Configuration
# Configuration for ETL component framework and implementations

component:
  # Default component settings
  default_timeout_seconds: 3600
  default_retry_attempts: 3
  enable_validation: true
  fail_fast: false

execution:
  # Execution behavior settings
  parallel_execution: false
  max_workers: 4
  batch_size: 1000
  commit_interval: 500

logging:
  # Logging configuration
  log_level: INFO
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_to_console: true
  log_to_file: true
  log_file_path: "logs/etl_component.log"
  log_rotation: daily
  log_retention_days: 30

monitoring:
  # Monitoring and metrics
  enable_metrics: true
  metrics_port: 9090
  enable_health_checks: true
  health_check_interval_seconds: 60

error_handling:
  # Error handling strategy
  retry_on_failure: true
  max_retries: 3
  retry_delay_seconds: 5
  exponential_backoff: true
  backoff_multiplier: 2
  max_retry_delay_seconds: 300

validation:
  # Validation rules
  validate_prerequisites: true
  validate_input_data: true
  validate_output_data: true
  strict_mode: false

performance:
  # Performance optimization
  enable_caching: false
  cache_ttl_seconds: 3600
  enable_profiling: false
  profile_output_path: "profiles/"

thresholds:
  # Quality thresholds
  min_success_rate_percent: 95.0
  max_error_rate_percent: 5.0
  max_duration_seconds: 7200
  max_memory_mb: 4096

components:
  # Component-specific configurations
  extractor:
    timeout_seconds: 1800
    batch_size: 5000
    parallel_reads: true
    
  transformer:
    timeout_seconds: 3600
    batch_size: 1000
    enable_caching: true
    
  loader:
    timeout_seconds: 1800
    batch_size: 500
    upsert_mode: false

metadata:
  # Metadata tracking
  track_lineage: true
  track_execution_stats: true
  store_sample_data: false
  sample_size: 100