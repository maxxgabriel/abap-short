# ETL Configuration
# Converted from: ABAP ETL system configuration

etl:
  # Batch processing configuration
  batch_size: 1000
  commit_interval: 500
  parallel_jobs: 1
  retry_attempts: 3
  timeout_seconds: 3600

  # Business rules - Discounts
  discount:
    qty_tier1: 10
    qty_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10

  # Business rules - Tax
  tax:
    rate: 0.08

  # Business rules - Cost calculations
  cost:
    ratio: 0.60

  # Business rules - Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

  # ID prefixes
  prefixes:
    etl_run: "ETL"
    log_id: "LOG"
    analytics_id: "ANL"

# Spark configuration
spark:
  app_name: "Sales_ETL_Pipeline"
  master: "local[*]"
  log_level: "WARN"
  
  # Memory settings
  driver_memory: "4g"
  executor_memory: "4g"
  
  # Shuffle settings
  sql_shuffle_partitions: 200
  
  # Serialization
  serializer: "org.apache.spark.serializer.KryoSerializer"

# Data sources
data_sources:
  raw_sales:
    format: "parquet"
    path: "data/raw/sales"
    
  analytics:
    format: "parquet"
    path: "data/analytics/sales"
    
  logs:
    format: "parquet"
    path: "data/logs/etl"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl_process.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Testing configuration
testing:
  test_mode: false
  sample_data_size: 100