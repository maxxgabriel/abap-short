# ETL Logger Configuration
# Delta Lake Audit Trail Settings

# Delta Lake paths
delta:
  audit_log_path: "/mnt/delta/etl_audit_log"
  checkpoint_path: "/mnt/delta/checkpoints/etl_logger"

# Spark configuration
spark:
  app_name: "ETL_Logger_AuditTrail"
  master: "local[*]"
  configs:
    spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
    spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
    spark.databricks.delta.retentionDurationCheck.enabled: "false"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"

# Logger settings
logger:
  default_username: "system"
  console_output: true
  buffer_size: 100
  flush_interval_seconds: 30

# Audit log retention
retention:
  days: 90
  vacuum_enabled: true
  vacuum_interval_hours: 24

# Business rules (from ZCL_ETL_CONSTANTS)
business_rules:
  discount_qty_tier1: 10
  discount_qty_tier2: 15
  discount_rate_tier1: 0.05
  discount_rate_tier2: 0.10
  tax_rate: 0.08
  cost_ratio: 0.60
  category_high_threshold: 2000.00
  category_medium_threshold: 500.00

# ETL configuration
etl:
  default_batch_size: 1000
  default_commit_interval: 500
  default_retry_attempts: 3
  default_timeout_seconds: 3600

# Status codes
status:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# Process steps
steps:
  - "INIT"
  - "EXTRACT"
  - "TRANSFORM"
  - "LOAD"
  - "VALIDATE"
  - "COMPLETE"
  - "ERROR"

# Categories
categories:
  - "HIGH"
  - "MEDIUM"
  - "LOW"