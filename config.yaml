# Sales ETL Configuration

# Business Rules
business_rules:
  # Discount calculation rules
  discount:
    qty_tier1: 10  # First discount threshold
    qty_tier2: 15  # Second discount threshold
    rate_tier1: 0.05  # 5% discount for qty > 10
    rate_tier2: 0.10  # 10% discount for qty > 15
  
  # Tax rate
  tax_rate: 0.08  # 8% tax rate
  
  # Cost ratio for profit calculation
  cost_ratio: 0.60  # Assume cost is 60% of unit price
  
  # Sale categorization thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# ETL Configuration
etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600

# Storage Configuration
storage:
  format: parquet  # Output format (parquet, delta, csv)
  mode: append     # Write mode (append, overwrite, error)
  partition_by:
    - trans_date
    - region

# Path Configuration
paths:
  raw_input: "input/raw_sales"
  analytics_output: "output/analytics"
  logs: "logs"
  checkpoints: "checkpoints"

# Spark Configuration
spark:
  app_name: "SalesETL"
  configs:
    "spark.sql.shuffle.partitions": "200"
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.serializer": "org.apache.spark.serializer.KryoSerializer"

# Logging Configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"