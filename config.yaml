# ETL Configuration File

# Spark Configuration
spark:
  app_name: "sales_etl_loader"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: "200"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"

# Extract Configuration
extract:
  source_path: "/data/raw/sales"
  source_format: "parquet"
  date_column: "trans_date"
  status_column: "status"
  filter_status: "N"  # New records only

# Transform Configuration
transform:
  discount_qty_tier1: 10
  discount_qty_tier2: 15
  discount_rate_tier1: 0.05
  discount_rate_tier2: 0.10
  tax_rate: 0.08
  cost_ratio: 0.60
  category_high_threshold: 2000.00
  category_medium_threshold: 500.00

# Load Configuration
load:
  target_path: "/data/analytics/sales"
  target_format: "parquet"
  write_mode: "append"  # append, overwrite, errorifexists
  partition_columns:
    - "trans_date"
    - "region"
  write_options:
    compression: "snappy"
    maxRecordsPerFile: 100000
  expected_columns:
    - analytics_id
    - trans_date
    - customer_id
    - product_id
    - total_quantity
    - gross_amount
    - net_amount
    - discount_amount
    - tax_amount
    - currency
    - sales_rep
    - region
    - profit_margin
    - category
    - etl_run_id
    - loaded_at
    - loaded_by

# Logging Configuration
logging:
  log_path: "/data/logs/etl"
  persist_logs: true
  log_level: "INFO"

# Error Handling
error_handling:
  error_path: "/data/errors/sales"
  max_error_threshold: 0.05  # 5% error threshold
  continue_on_error: true

# Business Rules
business_rules:
  status_codes:
    new: "N"
    processed: "P"
    error: "E"
    warning: "W"
    success: "S"
  
  categories:
    high: "HIGH"
    medium: "MEDIUM"
    low: "LOW"
  
  steps:
    init: "INIT"
    extract: "EXTRACT"
    transform: "TRANSFORM"
    load: "LOAD"
    validate: "VALIDATE"
    complete: "COMPLETE"
    error: "ERROR"

# Performance Tuning
performance:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  enable_caching: true
  repartition_before_write: true
  target_partition_size: 128  # MB