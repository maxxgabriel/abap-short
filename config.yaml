# ETL Configuration File
# PySpark Sales Data ETL System

# Application settings
application:
  name: "Sales ETL System"
  version: "1.0.0"
  description: "ETL system for sales data processing"

# Spark configuration
spark:
  app_name: "SalesETL"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: 10
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.driver.memory: "2g"
    spark.executor.memory: "2g"

# Data paths
paths:
  source: "data/input/sales_raw"
  target: "data/output/sales_analytics"
  logs: "data/logs"
  checkpoint: "data/checkpoint"

# Business rules
business_rules:
  # Discount thresholds
  discount_tier1_quantity: 10
  discount_tier2_quantity: 15
  discount_tier1_rate: 0.05  # 5%
  discount_tier2_rate: 0.10  # 10%
  
  # Tax rate
  tax_rate: 0.08  # 8%
  
  # Cost ratio for profit calculation
  cost_ratio: 0.60  # 60%
  
  # Category thresholds
  category_high_threshold: 2000.00
  category_medium_threshold: 500.00

# ETL processing configuration
processing:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_jobs: 4

# Date settings
date_settings:
  default_lookback_days: 7
  date_format: "%Y-%m-%d"
  timestamp_format: "%Y-%m-%d %H:%M:%S"

# Logging configuration
logging:
  level: "INFO"
  format: "[%(asctime)s] [%(levelname)s] %(name)s: %(message)s"
  console_output: true
  file_output: true
  log_file: "etl_execution.log"

# Data quality rules
data_quality:
  validate_required_fields: true
  validate_data_types: true
  validate_ranges: true
  max_error_percentage: 5.0

# Status codes
status_codes:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# ID prefixes
id_prefixes:
  etl_run: "ETL"
  log_id: "LOG"
  analytics_id: "ANL"

# Message templates
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"