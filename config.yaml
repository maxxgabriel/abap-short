# ETL Logging Configuration
# Migrated from ABAP ZCL_ETL_CONSTANTS and ZETL configuration

logging:
  # Delta table path for log persistence
  delta_table_path: "/mnt/etl/logs/etl_execution_log"
  
  # Console logging settings
  console_logging: true
  log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  
  # Default user for audit trail
  default_user: "etl_system"
  
  # Log buffer settings
  buffer_size: 100
  auto_flush_enabled: true
  auto_flush_interval_seconds: 60

# Status codes (from ABAP gc_status)
status_codes:
  success: "S"
  error: "E"
  warning: "W"
  info: "I"

# Process steps (from ABAP gc_step)
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# ETL configuration defaults (from ABAP gc_default_*)
etl_defaults:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600

# Delta table configuration
delta:
  # Optimization settings
  optimize_write: true
  optimize_z_order: ["etl_run_id", "execution_timestamp"]
  
  # Retention settings
  log_retention_days: 90
  vacuum_enabled: true
  
  # Performance settings
  data_skipping_enabled: true
  checkpoint_interval: 10

# Spark configuration overrides
spark:
  # Delta Lake specific settings
  sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
  sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
  
  # Performance tuning
  sql.shuffle.partitions: 200
  sql.adaptive.enabled: true
  sql.adaptive.coalescePartitions.enabled: true

# Monitoring and alerting
monitoring:
  enable_metrics: true
  metrics_output_path: "/mnt/etl/metrics"
  alert_on_error_threshold: 10
  alert_on_error_percentage: 5.0