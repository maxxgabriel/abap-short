# ETL Configuration File
# Sales Data ETL System

# Application metadata
application:
  name: "Sales ETL System"
  version: "1.0.0"
  description: "Complete ETL system for sales data processing"

# Spark configuration
spark:
  app_name: "SalesETL"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: 200
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"

# Database paths (adjust for your environment)
paths:
  raw_sales: "data/raw/sales"
  analytics: "data/analytics/sales"
  logs: "logs/etl"
  format: "parquet"  # parquet, delta, csv

# Business rules
business_rules:
  # Discount tiers
  discount:
    qty_tier1: 10
    qty_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10
  
  # Tax calculation
  tax_rate: 0.08
  
  # Cost calculation
  cost_ratio: 0.60
  
  # Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# ETL processing configuration
etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_jobs: 4

# Logging configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - [%(levelname)s] - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  
# Data quality rules
data_quality:
  required_fields:
    - trans_id
    - customer_id
    - product_id
    - quantity
    - unit_price
  
  validation_rules:
    quantity_min: 1
    unit_price_min: 0.01
    currency_length: 3

# ID prefixes
id_prefixes:
  etl_run: "ETL"
  log_id: "LOG"
  analytics_id: "ANL"

# Messages
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"