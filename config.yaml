# PySpark ETL Configuration
spark:
  app_name: "Sales ETL Process"
  master: "local[*]"
  log_level: "WARN"
  configs:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"

# Data source configuration
source:
  format: "jdbc"
  url: "jdbc:sap://hostname:port"
  driver: "com.sap.db.jdbc.Driver"
  table: "ZSALES_RAW"
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  
  # Query options
  partition_column: "TRANS_DATE"
  num_partitions: 10
  fetch_size: 1000

# Target configuration
target:
  format: "jdbc"
  url: "jdbc:sap://hostname:port"
  driver: "com.sap.db.jdbc.Driver"
  table: "ZSALES_ANALYTICS"
  mode: "append"
  batch_size: 500
  
# Logging configuration
logging:
  log_table: "ZETL_LOG"
  console_output: true
  file_output: true
  log_level: "INFO"

# Business rules
business_rules:
  discount:
    tier1:
      quantity_threshold: 10
      rate: 0.05
    tier2:
      quantity_threshold: 15
      rate: 0.10
  
  tax:
    rate: 0.08
  
  cost:
    ratio: 0.60
  
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Processing configuration
processing:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  test_mode: false

# Date range (defaults)
date_range:
  default_days_back: 7