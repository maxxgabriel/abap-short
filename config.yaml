# ETL Configuration File
# Sales Data ETL System Configuration

# Core ETL Settings
batch_size: 1000
commit_interval: 500
retry_attempts: 3
timeout_seconds: 3600
parallel_jobs: 4

# Logging Configuration
log_level: INFO
log_file: logs/etl.log

# Data Paths
source_path: data/input
target_path: data/output

# Business Rules Configuration
business_rules:
  # Discount thresholds and rates
  discount_qty_tier1: 10
  discount_qty_tier2: 15
  discount_rate_tier1: 0.05
  discount_rate_tier2: 0.10
  
  # Tax rate
  tax_rate: 0.08
  
  # Cost calculation
  cost_ratio: 0.60
  
  # Category thresholds
  category_high_threshold: 2000.00
  category_medium_threshold: 500.00

# Spark Configuration (for PySpark ETL)
spark:
  app_name: SalesETL
  master: local[*]
  driver_memory: 4g
  executor_memory: 4g
  executor_cores: 2
  
  # Spark SQL settings
  sql:
    shuffle_partitions: 200
    adaptive_enabled: true
    
  # Spark configurations
  configs:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.serializer: org.apache.spark.serializer.KryoSerializer

# Data Quality Checks
data_quality:
  enable_validation: true
  max_error_percentage: 5.0
  required_fields:
    - trans_id
    - customer_id
    - product_id
    - quantity
    - unit_price