# ETL Logger Configuration

# Logging Configuration
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: INFO
  
  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Console output
  console_output: true
  
  # File output configuration
  file_output:
    enabled: false
    path: "/tmp/etl_logs"
    filename_pattern: "etl_{run_id}_{date}.log"
    max_size_mb: 100
    backup_count: 5

# Database Configuration
database:
  # Log table configuration
  log_table:
    name: "etl_log"
    database: "etl_db"
    write_mode: "append"
    
  # Connection settings
  connection:
    url: "jdbc:postgresql://localhost:5432/etl"
    driver: "org.postgresql.Driver"
    user: "etl_user"
    password_env: "ETL_DB_PASSWORD"

# ETL Run Configuration
etl_run:
  # ID generation
  id_prefix: "ETL"
  id_format: "timestamp"  # timestamp, uuid, sequential
  
  # Log entry ID generation
  log_id_prefix: "LOG"

# Status Codes Configuration
status_codes:
  success: "S"
  error: "E"
  warning: "W"
  info: "I"

# Process Steps Configuration
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Performance Configuration
performance:
  # Batch logging (group multiple log entries)
  batch_logging:
    enabled: false
    batch_size: 100
    flush_interval_seconds: 30
  
  # Async logging
  async_logging:
    enabled: false
    queue_size: 1000
    worker_threads: 2

# Message Templates
message_templates:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"

# Retention Policy
retention:
  # Days to keep logs
  log_retention_days: 90
  
  # Cleanup schedule
  cleanup_enabled: true
  cleanup_schedule: "0 2 * * *"  # Daily at 2 AM