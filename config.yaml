# PySpark ETL Configuration for Sales Data Processing

spark:
  app_name: "SalesETLProcess"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: 200
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"

database:
  source:
    format: "jdbc"
    url: "jdbc:postgresql://localhost:5432/sales_db"
    driver: "org.postgresql.Driver"
    table: "zsales_raw"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
  
  target:
    format: "jdbc"
    url: "jdbc:postgresql://localhost:5432/analytics_db"
    driver: "org.postgresql.Driver"
    table: "zsales_analytics"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
  
  logging:
    format: "jdbc"
    url: "jdbc:postgresql://localhost:5432/etl_db"
    driver: "org.postgresql.Driver"
    table: "zetl_log"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"

etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  test_mode: false

business_rules:
  discount:
    tier1_quantity: 10
    tier2_quantity: 15
    tier1_rate: 0.05
    tier2_rate: 0.10
  
  tax_rate: 0.08
  cost_ratio: 0.60
  
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl_process.log"