# ETL Configuration
# Converted from ABAP constants in ZCL_ETL_CONSTANTS

# Status Codes
status_codes:
  new: 'N'
  processed: 'P'
  error: 'E'
  warning: 'W'
  success: 'S'
  info: 'I'

# ETL Process Steps
process_steps:
  init: 'INIT'
  extract: 'EXTRACT'
  transform: 'TRANSFORM'
  load: 'LOAD'
  validate: 'VALIDATE'
  complete: 'COMPLETE'
  error: 'ERROR'

# Sale Categories
sale_categories:
  high: 'HIGH'
  medium: 'MEDIUM'
  low: 'LOW'

# Business Rules - Discounts
discount_rules:
  quantity_tier1: 10
  quantity_tier2: 15
  rate_tier1: 0.05
  rate_tier2: 0.10

# Business Rules - Tax
tax_rules:
  tax_rate: 0.08

# Business Rules - Cost
cost_rules:
  cost_ratio: 0.60

# Business Rules - Categories
category_thresholds:
  high: 2000.00
  medium: 500.00

# ETL Configuration
etl_config:
  default_batch_size: 1000
  default_commit_interval: 500
  default_retry_attempts: 3
  default_timeout_seconds: 3600
  parallel_jobs: 4

# ID Prefixes
id_prefixes:
  etl_run: 'ETL'
  log_id: 'LOG'
  analytics_id: 'ANL'

# Logging Configuration
logging:
  level: 'INFO'
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  log_dir: 'logs'
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Spark Configuration
spark:
  app_name: 'Sales ETL System'
  master: 'local[*]'
  config:
    spark.sql.shuffle.partitions: 200
    spark.executor.memory: '4g'
    spark.driver.memory: '2g'
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true

# Database Configuration
database:
  source_table: 'zsales_raw'
  target_table: 'zsales_analytics'
  log_table: 'zetl_log'
  
# Message Templates
messages:
  init_success: 'ETL process initialized successfully'
  extract_start: 'Starting data extraction'
  extract_complete: 'Data extraction completed'
  transform_start: 'Starting data transformation'
  transform_complete: 'Data transformation completed'
  load_start: 'Starting data load'
  load_complete: 'Data load completed'
  etl_complete: 'ETL process completed successfully'
  etl_error: 'ETL process failed'