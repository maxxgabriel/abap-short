# ETL Logger Configuration

# Spark Configuration
spark:
  app_name: "SalesETLLogger"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: "8"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console_enabled: true
  file_enabled: true
  file_path: "logs/etl_execution.log"

# ETL Run Configuration
etl:
  run_id_prefix: "ETL"
  log_id_prefix: "LOG"
  
# Delta Table Configuration
delta:
  log_table_path: "/data/etl_logs"
  checkpoint_location: "/data/checkpoints/etl_logs"
  
# Status Codes
status_codes:
  success: "S"
  error: "E"
  warning: "W"
  info: "I"

# Process Steps
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Business Rules (migrated from ABAP constants)
business_rules:
  discount:
    quantity_tier1: 10
    quantity_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10
  tax_rate: 0.08
  cost_ratio: 0.60
  category_thresholds:
    high: 2000.00
    medium: 500.00

# ETL Process Configuration
etl_config:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_jobs: 4