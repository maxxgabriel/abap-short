# ETL Configuration
# Replaces ABAP configuration and constants

etl:
  # Processing configuration
  batch_size: 1000
  commit_interval: 500
  parallel_jobs: 4
  retry_attempts: 3
  timeout_seconds: 3600
  
  # Default date range (days)
  default_lookback_days: 7

# Business rules
business_rules:
  # Discount thresholds
  discount:
    quantity_tier1: 10
    quantity_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10
  
  # Tax rate
  tax_rate: 0.08
  
  # Cost ratio for profit calculation
  cost_ratio: 0.60
  
  # Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# ID prefixes
id_prefixes:
  etl_run: "ETL"
  log: "LOG"
  analytics: "ANL"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl_process.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Database configuration
database:
  # Source table
  source_table: "zsales_raw"
  
  # Target table
  target_table: "zsales_analytics"
  
  # Log table
  log_table: "zetl_log"

# Spark configuration
spark:
  app_name: "Sales ETL Process"
  master: "local[*]"
  
  # Spark options
  options:
    "spark.sql.shuffle.partitions": "200"
    "spark.sql.adaptive.enabled": "true"
    "spark.sql.adaptive.coalescePartitions.enabled": "true"
    "spark.executor.memory": "4g"
    "spark.driver.memory": "2g"

# Validation rules
validation:
  required_fields:
    raw_sales:
      - "trans_id"
      - "trans_date"
      - "customer_id"
      - "product_id"
      - "quantity"
      - "unit_price"
      - "currency"
    
    analytics:
      - "analytics_id"
      - "customer_id"
      - "product_id"
      - "gross_amount"
      - "currency"
  
  # Valid currency codes
  valid_currencies:
    - "USD"
    - "EUR"
    - "GBP"
    - "JPY"
    - "CAD"
    - "AUD"
  
  # Valid regions
  valid_regions:
    - "NORTH"
    - "SOUTH"
    - "EAST"
    - "WEST"
  
  # Valid categories
  valid_categories:
    - "HIGH"
    - "MEDIUM"
    - "LOW"

# Message templates
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"