# ETL Configuration for Sales Analytics Pipeline
# Migrated from ABAP ZCL_ETL_CONSTANTS and package configuration

# Spark Configuration
spark:
  app_name: "Sales_ETL_Pipeline"
  master: "local[*]"
  log_level: "INFO"
  
  # Spark configs
  configs:
    spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
    spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.databricks.delta.retentionDurationCheck.enabled: "false"
    spark.databricks.delta.schema.autoMerge.enabled: "true"

# Extract Configuration
extract:
  # Source table configuration
  source_table: "zsales_raw"
  source_format: "parquet"  # or "jdbc" for direct database connection
  source_path: "data/input/sales_raw"
  
  # Date range (can be overridden at runtime)
  date_column: "trans_date"
  default_lookback_days: 7
  
  # Filtering
  status_filter: "N"  # New records only (corresponds to gc_status-new)
  
  # JDBC configuration (if reading from database)
  jdbc:
    url: "jdbc:oracle:thin:@localhost:1521:xe"
    driver: "oracle.jdbc.driver.OracleDriver"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
    fetch_size: 1000
    partition_column: "trans_date"
    num_partitions: 4

# Transform Configuration
transform:
  # Business rules - Discount thresholds
  discount:
    tier1_quantity: 10
    tier1_rate: 0.05
    tier2_quantity: 15
    tier2_rate: 0.10
  
  # Business rules - Tax rate
  tax_rate: 0.08
  
  # Business rules - Cost ratio for profit calculation
  cost_ratio: 0.60
  
  # Business rules - Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00
  
  # Category values
  categories:
    high: "HIGH"
    medium: "MEDIUM"
    low: "LOW"
  
  # Validation rules
  validation:
    max_quantity: 10000
    max_unit_price: 100000.00
    min_unit_price: 0.01
    valid_currencies: ["USD", "EUR", "GBP"]

# Load Configuration
load:
  # Target Delta table configuration
  target_table: "sales_analytics"
  delta_path: "data/output/sales_analytics_delta"
  
  # Write configuration
  write_mode: "append"  # append, overwrite, or merge
  batch_size: 1000  # corresponds to gc_default_batch_size
  commit_interval: 500  # corresponds to gc_default_commit_interval
  
  # Partitioning
  partition_columns: ["trans_date", "region"]
  
  # Delta Lake optimization
  enable_optimize: true
  enable_vacuum: false
  vacuum_retention_hours: 168  # 7 days
  
  # Merge configuration (for upsert operations)
  merge_keys: ["analytics_id"]
  
  # Performance tuning
  max_records_per_file: 100000
  compression: "snappy"

# ETL Orchestration Configuration
orchestration:
  # Retry configuration
  retry_attempts: 3  # corresponds to gc_default_retry_attempts
  retry_delay_seconds: 30
  timeout_seconds: 3600  # corresponds to gc_default_timeout_seconds
  
  # Parallel processing
  enable_parallel: false
  max_parallel_tasks: 4
  
  # Checkpointing
  enable_checkpoint: true
  checkpoint_path: "data/checkpoint"
  
  # Testing
  test_mode: false
  test_sample_size: 100

# Logging Configuration
logging:
  # Log level
  level: "INFO"
  
  # Log output
  console_output: true
  file_output: true
  log_file_path: "logs/etl_execution.log"
  
  # Log table configuration
  log_table: "etl_log"
  log_path: "data/logs/etl_log"
  
  # Log rotation
  max_log_size_mb: 100
  backup_count: 5
  
  # Metrics
  enable_metrics: true
  metrics_path: "data/metrics"

# Status Codes (from gc_status)
status_codes:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# Process Steps (from gc_step)
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# ID Prefixes (from gc_prefix_*)
id_prefixes:
  etl_run: "ETL"
  log_id: "LOG"
  analytics_id: "ANL"

# Message Templates
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"

# Data Quality Rules
data_quality:
  enable_validation: true
  fail_on_validation_error: false
  max_error_percentage: 5.0
  
  # Record validation rules
  required_fields:
    - analytics_id
    - customer_id
    - product_id
    - gross_amount
    - currency
    - category