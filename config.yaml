# ETL Framework Configuration
# Shared configuration for all ETL modules

# Application Settings
application:
  name: "Sales ETL System"
  version: "1.0.0"
  environment: "development"

# Spark Configuration
spark:
  app_name: "SalesETL"
  master: "local[*]"
  log_level: "WARN"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.sql.sources.partitionOverwriteMode: "dynamic"
    spark.serializer: "org.apache.spark.serializer.KryoSerializer"

# Database Configuration
database:
  source:
    url: "jdbc:postgresql://localhost:5432/sales_raw"
    driver: "org.postgresql.Driver"
    user: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:postgres}"
    properties:
      fetchsize: "10000"
      batchsize: "5000"
  
  target:
    url: "jdbc:postgresql://localhost:5432/sales_analytics"
    driver: "org.postgresql.Driver"
    user: "${DB_USER:postgres}"
    password: "${DB_PASSWORD:postgres}"
    properties:
      batchsize: "5000"
      rewriteBatchedStatements: "true"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"
  file:
    enabled: true
    path: "logs/etl_{run_id}.log"
    max_bytes: 10485760  # 10MB
    backup_count: 5
  console:
    enabled: true
    colored: true
  database:
    enabled: true
    table: "etl_log"
    batch_size: 100

# ETL Configuration
etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  retry_delay_seconds: 5
  timeout_seconds: 3600
  parallel_jobs: 4
  
  # Status codes
  status:
    new: "N"
    processed: "P"
    error: "E"
    warning: "W"
    success: "S"
    info: "I"
  
  # Process steps
  steps:
    init: "INIT"
    extract: "EXTRACT"
    transform: "TRANSFORM"
    load: "LOAD"
    validate: "VALIDATE"
    complete: "COMPLETE"
    error: "ERROR"

# Business Rules Configuration
business_rules:
  # Discount thresholds
  discount:
    tier1:
      quantity: 10
      rate: 0.05
    tier2:
      quantity: 15
      rate: 0.10
  
  # Tax configuration
  tax:
    rate: 0.08
  
  # Cost calculation
  cost:
    ratio: 0.60
  
  # Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00
    labels:
      high: "HIGH"
      medium: "MEDIUM"
      low: "LOW"

# ID Generation
id_generation:
  prefixes:
    etl_run: "ETL"
    log: "LOG"
    analytics: "ANL"
  timestamp_format: "%Y%m%d%H%M%S"

# Validation Rules
validation:
  required_fields:
    - "trans_id"
    - "customer_id"
    - "product_id"
    - "gross_amount"
    - "currency"
  
  allowed_currencies:
    - "USD"
    - "EUR"
    - "GBP"
  
  allowed_categories:
    - "HIGH"
    - "MEDIUM"
    - "LOW"

# Data Quality
data_quality:
  enable_validation: true
  error_threshold_percent: 5.0
  null_check_fields:
    - "customer_id"
    - "product_id"
    - "trans_date"
  
  range_checks:
    quantity:
      min: 1
      max: 10000
    unit_price:
      min: 0.01
      max: 100000.00

# Performance Tuning
performance:
  enable_caching: true
  checkpoint_interval: 10
  shuffle_partitions: 200
  broadcast_threshold: 10485760  # 10MB
  
# Monitoring
monitoring:
  enable_metrics: true
  metrics_interval_seconds: 60
  alert_on_errors: true
  alert_threshold_errors: 10