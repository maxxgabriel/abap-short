# Sales ETL System Configuration
# Migrated from ABAP $ZETL Package

etl:
  # ETL process configuration
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_jobs: 4
  
  # Date range defaults (days)
  default_lookback_days: 7

business_rules:
  # Discount rules
  discount:
    quantity_tier1: 10
    quantity_tier2: 15
    rate_tier1: "0.05"  # 5%
    rate_tier2: "0.10"  # 10%
  
  # Tax configuration
  tax:
    rate: "0.08"  # 8%
  
  # Cost and profit
  cost:
    ratio: "0.60"  # 60% of unit price
  
  # Category thresholds
  category:
    high_threshold: "2000.00"
    medium_threshold: "500.00"

database:
  # Source table
  source_table: "zsales_raw"
  
  # Target table
  target_table: "zsales_analytics"
  
  # Log table
  log_table: "zetl_log"

logging:
  # Logging configuration
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Log file settings
  file:
    enabled: true
    path: "logs/etl.log"
    max_bytes: 10485760  # 10MB
    backup_count: 5

spark:
  # Spark configuration
  app_name: "SalesETL"
  master: "local[*]"
  
  # Memory settings
  driver_memory: "2g"
  executor_memory: "4g"
  
  # Shuffle partitions
  sql_shuffle_partitions: 200
  
  # Checkpoint directory
  checkpoint_dir: "/tmp/spark-checkpoint"

validation:
  # Data validation rules
  required_fields:
    - trans_id
    - customer_id
    - product_id
    - quantity
    - unit_price
  
  # Field constraints
  constraints:
    quantity:
      min: 1
      max: 10000
    unit_price:
      min: "0.01"
      max: "999999.99"

error_handling:
  # Error handling configuration
  fail_on_validation_error: false
  max_error_percentage: 5.0
  
  # Error notification
  notification:
    enabled: false
    email_to: []

test_mode:
  # Test mode settings
  enabled: false
  sample_size: 100
  skip_commit: true