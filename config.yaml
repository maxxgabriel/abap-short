# ETL Configuration File
# Sales Data ETL System Configuration

# Spark Configuration
spark:
  app_name: "Sales ETL Pipeline"
  master: "local[*]"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.sql.sources.partitionOverwriteMode: "dynamic"

# ETL Processing Parameters
etl:
  # Batch processing settings
  batch_size: 1000
  commit_interval: 500
  parallel_jobs: 4
  retry_attempts: 3
  timeout_seconds: 3600
  
  # ID prefixes
  prefix:
    etl_run: "ETL"
    log_id: "LOG"
    analytics_id: "ANL"

# Business Rules Configuration
business_rules:
  # Discount tiers
  discount:
    qty_tier1: 10
    qty_tier2: 15
    rate_tier1: 0.05  # 5% discount
    rate_tier2: 0.10  # 10% discount
  
  # Tax configuration
  tax:
    rate: 0.08  # 8% tax rate
  
  # Cost calculation
  cost:
    ratio: 0.60  # Cost is 60% of unit price
  
  # Sale categorization thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Data Source Configuration
source:
  # Source table/file configuration
  type: "delta"  # delta, parquet, csv, jdbc
  path: "data/raw/sales"
  format: "delta"
  
  # JDBC connection (if applicable)
  jdbc:
    url: "jdbc:postgresql://localhost:5432/sales_db"
    driver: "org.postgresql.Driver"
    table: "zsales_raw"
    user: "etl_user"
    password_env: "DB_PASSWORD"  # Read from environment variable
  
  # File source options
  file:
    delimiter: ","
    header: true
    schema_inference: false

# Target Configuration
target:
  # Target table/file configuration
  type: "delta"
  path: "data/analytics/sales"
  format: "delta"
  mode: "append"  # append, overwrite
  
  # Partitioning
  partition_by:
    - "trans_date"
    - "region"
  
  # JDBC connection (if applicable)
  jdbc:
    url: "jdbc:postgresql://localhost:5432/sales_db"
    driver: "org.postgresql.Driver"
    table: "zsales_analytics"
    user: "etl_user"
    password_env: "DB_PASSWORD"

# Logging Configuration
logging:
  # Log table/file configuration
  type: "delta"
  path: "data/logs/etl_log"
  format: "delta"
  
  # Console logging
  console:
    enabled: true
    level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  
  # File logging
  file:
    enabled: true
    path: "logs/etl.log"
    level: "DEBUG"
    max_bytes: 10485760  # 10MB
    backup_count: 5

# Data Quality Rules
data_quality:
  # Validation rules
  validation:
    check_nulls: true
    check_duplicates: true
    check_data_types: true
  
  # Required fields
  required_fields:
    raw_sales:
      - "trans_id"
      - "trans_date"
      - "customer_id"
      - "product_id"
      - "quantity"
      - "unit_price"
      - "currency"
    
    analytics:
      - "analytics_id"
      - "customer_id"
      - "product_id"
      - "gross_amount"
      - "net_amount"
      - "currency"
      - "category"
  
  # Data type constraints
  constraints:
    quantity:
      min: 1
      max: 10000
    unit_price:
      min: 0.01
      max: 999999.99
    gross_amount:
      min: 0.01

# Monitoring and Alerting
monitoring:
  # Performance thresholds
  thresholds:
    max_duration_minutes: 60
    min_success_rate: 0.95  # 95%
    max_error_rate: 0.05    # 5%
  
  # Alert configuration
  alerts:
    enabled: false
    email:
      recipients:
        - "etl-team@example.com"
      smtp_host: "smtp.example.com"
      smtp_port: 587

# Test Mode Configuration
test_mode:
  enabled: false
  sample_size: 100
  use_mock_data: false
  skip_commit: true