# ETL Logger Configuration
# Converted from ABAP package $ZETL configuration

etl:
  # Run identification
  run_id_prefix: "ETL"
  log_id_prefix: "LOG"
  
  # Logging configuration
  logging:
    console_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
    log_table: "etl_logs"  # Database table for persistent logs
    enable_database_logging: true
    flush_interval: 100  # Flush logs to DB every N entries
    
  # Process steps (for reference)
  steps:
    - INIT
    - EXTRACT
    - TRANSFORM
    - LOAD
    - VALIDATE
    - COMPLETE
    - ERROR
    
  # Status codes (for reference)
  statuses:
    - SUCCESS  # 'S'
    - ERROR    # 'E'
    - WARNING  # 'W'
    - INFO     # 'I'

# Message templates
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"

# Database configuration
database:
  # Schema for ETL tables
  schema: "etl_schema"
  
  # Table names
  tables:
    raw_sales: "sales_raw"
    analytics: "sales_analytics"
    etl_log: "etl_log"
    
  # Write options
  write_mode: "append"  # append, overwrite
  partition_by: ["execution_date"]
  
# Performance settings
performance:
  batch_size: 1000
  commit_interval: 500
  max_retries: 3
  timeout_seconds: 3600
  parallel_tasks: 4

# Monitoring and alerts
monitoring:
  enable_metrics: true
  metrics_table: "etl_metrics"
  alert_on_error: true
  alert_threshold_errors: 10