# ETL System Configuration
# Migrated from ABAP ETL Constants

# Processing Configuration
processing:
  batch_size: 1000
  commit_interval: 500
  parallel_jobs: 4
  retry_attempts: 3
  timeout_seconds: 3600

# Business Rules Configuration
business_rules:
  # Discount thresholds and rates
  discount_qty_tier1: 10
  discount_qty_tier2: 15
  discount_rate_tier1: 0.05
  discount_rate_tier2: 0.10
  
  # Tax and cost calculations
  tax_rate: 0.08
  cost_ratio: 0.60
  
  # Sale categorization thresholds
  category_high_threshold: 2000.00
  category_medium_threshold: 500.00

# Data Sources Configuration
data_sources:
  source_table: zsales_raw
  target_table: zsales_analytics
  log_table: zetl_log

# File Paths Configuration
paths:
  data_path: data/
  log_path: logs/
  checkpoint_path: checkpoints/

# Spark Configuration
spark:
  app_name: SalesETL
  master: local[*]
  sql_shuffle_partitions: 200
  executor_memory: 4g
  driver_memory: 2g

# Logging Configuration
logging:
  level: INFO
  enable_console: true
  enable_file: true

# Test Mode Configuration
test_mode:
  enabled: false
  record_limit: 100