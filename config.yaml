# ETL Logger Configuration
# Maps to ABAP $ZETL package configuration

spark:
  app_name: "sales_etl_logger"
  master: "local[*]"
  config:
    spark.sql.extensions: "io.delta.sql.DeltaSparkSessionExtension"
    spark.sql.catalog.spark_catalog: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
    spark.databricks.delta.retentionDurationCheck.enabled: "false"

# Delta Lake paths
delta:
  log_table_path: "/tmp/delta/zetl_log"
  raw_sales_path: "/tmp/delta/zsales_raw"
  analytics_path: "/tmp/delta/zsales_analytics"

# ETL Configuration (maps to ABAP gc_default_* constants)
etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  
# Business Rules (maps to ABAP ZCL_ETL_CONSTANTS)
business_rules:
  discount:
    qty_tier1: 10
    qty_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10
  
  tax_rate: 0.08
  cost_ratio: 0.60
  
  category_thresholds:
    high: 2000.00
    medium: 500.00

# Logging Configuration
logging:
  console_output: true
  buffer_size: 100
  auto_flush: true
  
# ID Prefixes (maps to ABAP gc_prefix_* constants)
prefixes:
  etl_run: "ETL"
  log_id: "LOG"
  analytics_id: "ANL"