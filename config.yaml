# ETL Configuration File
# Migrated from ABAP ZCL_ETL_CONSTANTS class

# Status Codes
status:
  new: 'N'
  processed: 'P'
  error: 'E'
  warning: 'W'
  success: 'S'
  info: 'I'

# ETL Process Steps
steps:
  init: 'INIT'
  extract: 'EXTRACT'
  transform: 'TRANSFORM'
  load: 'LOAD'
  validate: 'VALIDATE'
  complete: 'COMPLETE'
  error: 'ERROR'

# Sale Categories
categories:
  high: 'HIGH'
  medium: 'MEDIUM'
  low: 'LOW'

# Business Rules - Discount Thresholds
discount:
  qty_tier1: 10
  qty_tier2: 15
  rate_tier1: 0.05  # 5%
  rate_tier2: 0.10  # 10%

# Business Rules - Tax Rate
tax:
  rate: 0.08  # 8%

# Business Rules - Cost Ratio
cost:
  ratio: 0.60  # 60%

# Business Rules - Category Thresholds
category_thresholds:
  high: 2000.00
  medium: 500.00

# ETL Configuration Defaults
etl_config:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_jobs: 4

# ID Prefixes
prefixes:
  etl_run: 'ETL'
  log_id: 'LOG'
  analytics_id: 'ANL'

# Message Texts
messages:
  init_success: 'ETL process initialized successfully'
  extract_start: 'Starting data extraction'
  extract_complete: 'Data extraction completed'
  transform_start: 'Starting data transformation'
  transform_complete: 'Data transformation completed'
  load_start: 'Starting data load'
  load_complete: 'Data load completed'
  etl_complete: 'ETL process completed successfully'
  etl_error: 'ETL process failed'

# Logging Configuration
logging:
  level: 'INFO'
  log_file: 'logs/etl_process.log'
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  console_output: true

# Database Configuration (for future use)
database:
  tables:
    raw_sales: 'zsales_raw'
    analytics: 'zsales_analytics'
    etl_log: 'zetl_log'

# Spark Configuration
spark:
  app_name: 'SalesETL'
  master: 'local[*]'
  config:
    spark.sql.shuffle.partitions: 200
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true