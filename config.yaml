# ETL Configuration
# Migrated from ABAP $ZETL package configuration

etl:
  # Batch processing configuration
  batch_size: 1000
  commit_interval: 500
  parallel_jobs: 4
  retry_attempts: 3
  timeout_seconds: 3600
  
  # ID prefixes (from ZCL_ETL_CONSTANTS)
  prefixes:
    etl_run: "ETL"
    log_id: "LOG"
    analytics_id: "ANL"

# Business rules (from ZCL_ETL_CONSTANTS)
business_rules:
  # Discount tiers
  discount:
    qty_tier1: 10
    qty_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10
  
  # Tax rate
  tax_rate: 0.08
  
  # Cost ratio for profit margin calculation
  cost_ratio: 0.60
  
  # Category thresholds
  categories:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Spark configuration
spark:
  app_name: "Sales ETL System"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: 200
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true
    spark.driver.memory: "4g"
    spark.executor.memory: "4g"

# Data paths
paths:
  # Input/Output paths (configure based on environment)
  raw_sales: "data/raw/sales"
  analytics: "data/analytics/sales"
  logs: "data/logs"
  
  # Archive paths
  archive: "data/archive"
  error: "data/error"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl_execution.log"
  console: true

# Database connection (if using JDBC)
database:
  driver: "org.postgresql.Driver"
  url: "jdbc:postgresql://localhost:5432/etl_db"
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"
  properties:
    batchsize: 1000

# Status codes (from ZCL_ETL_CONSTANTS)
status_codes:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# Process steps (from ZCL_ETL_CONSTANTS)
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"