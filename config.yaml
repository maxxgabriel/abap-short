# ETL Configuration File
# Sales Data Processing Pipeline

# Spark Configuration
spark:
  app_name: "SalesETLPipeline"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: 10
    spark.sql.adaptive.enabled: true
    spark.sql.adaptive.coalescePartitions.enabled: true

# Data Source Configuration
source_path: "data/raw/sales"
source_format: "parquet"

# Data Target Configuration
target_path: "data/analytics/sales"
target_format: "parquet"
write_mode: "append"
partition_by:
  - "trans_date"

# Business Rules - Discount Thresholds
discount_qty_tier1: 10
discount_qty_tier2: 15
discount_rate_tier1: 0.05
discount_rate_tier2: 0.10

# Business Rules - Tax and Cost
tax_rate: 0.08
cost_ratio: 0.60

# Business Rules - Category Thresholds
category_high_threshold: 2000.00
category_medium_threshold: 500.00

# ETL Configuration
batch_size: 1000
commit_interval: 500
max_retries: 3
timeout_seconds: 3600

# Logging Configuration
log_level: "INFO"
log_path: "logs/etl"

# Validation Rules
validation:
  check_nulls: true
  check_amounts: true
  check_categories: true
  min_records: 1

# Performance Tuning
performance:
  cache_intermediate_results: true
  broadcast_threshold: "10MB"
  parallel_jobs: 4