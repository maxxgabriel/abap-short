# ETL Logger Configuration
# Converted from ABAP $ZETL package configuration

etl_config:
  # Process identification
  prefix:
    etl_run: "ETL"
    log_id: "LOG"
    analytics_id: "ANL"
  
  # Batch processing
  batch:
    default_size: 1000
    commit_interval: 500
    retry_attempts: 3
    timeout_seconds: 3600
  
  # Business rules - Discounts
  discount:
    qty_tier1: 10
    qty_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10
  
  # Business rules - Tax
  tax:
    rate: 0.08
  
  # Business rules - Costs
  cost:
    ratio: 0.60
  
  # Business rules - Categorization
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Logging configuration
logging:
  # Log output destinations
  destinations:
    console: true
    file: true
    delta_table: true
  
  # Log storage paths
  paths:
    delta_table: "s3://etl-logs/etl_log"
    file_path: "/tmp/etl_logs"
  
  # Log levels
  levels:
    default: "INFO"
    error: "ERROR"
    warning: "WARNING"
  
  # Log retention
  retention:
    days: 30
    max_entries: 1000000

# Status codes mapping
status_codes:
  success: "S"
  error: "E"
  warning: "W"
  info: "I"
  new: "N"
  processed: "P"

# Process steps
process_steps:
  - INIT
  - EXTRACT
  - TRANSFORM
  - LOAD
  - VALIDATE
  - COMPLETE
  - ERROR

# Messages
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"