# Sales ETL Pipeline Configuration

# Spark Configuration
spark:
  app_name: "Sales_ETL_Pipeline"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.sql.sources.partitionOverwriteMode: "dynamic"

# Business Rules
business_rules:
  # Discount calculation rules
  discount:
    tier1_quantity: 10
    tier2_quantity: 15
    tier1_rate: 0.05  # 5% discount
    tier2_rate: 0.10  # 10% discount
  
  # Tax rate
  tax_rate: 0.08  # 8% tax
  
  # Cost ratio for profit calculation
  cost_ratio: 0.60  # 60% of unit price
  
  # Category thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Data Paths
paths:
  source: "data/raw/sales"
  target: "data/analytics/sales"
  logs: "logs/etl"

# Load Configuration
load:
  format: "parquet"
  mode: "append"
  partition_by:
    - "trans_date"
  
# ETL Configuration
etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600

# Validation Rules
validation:
  required_fields:
    - "analytics_id"
    - "customer_id"
    - "product_id"
    - "gross_amount"
    - "currency"
  
  valid_categories:
    - "HIGH"
    - "MEDIUM"
    - "LOW"
  
  valid_currencies:
    - "USD"
    - "EUR"
    - "GBP"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_enabled: true
  console_enabled: true