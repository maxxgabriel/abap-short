# ETL Configuration - Loader Module

# Source configuration
source:
  raw_table: "sales_raw"
  format: "parquet"  # parquet, delta, jdbc
  path: "/data/raw/sales"
  jdbc:
    url: "jdbc:postgresql://localhost:5432/sales_db"
    properties:
      user: "${DB_USER}"
      password: "${DB_PASSWORD}"
      driver: "org.postgresql.Driver"

# Target configuration
target:
  analytics_table: "sales_analytics"
  format: "parquet"  # parquet, delta, jdbc
  path: "/data/analytics/sales"
  jdbc:
    url: "jdbc:postgresql://localhost:5432/sales_db"
    properties:
      user: "${DB_USER}"
      password: "${DB_PASSWORD}"
      driver: "org.postgresql.Driver"

# Load configuration
load:
  write_mode: "append"  # append, overwrite, error, ignore
  batch_size: 1000
  partition_by:
    - "trans_date"
    - "region"
  write_options:
    compression: "snappy"
    maxRecordsPerFile: 50000

# Validation rules
validation:
  valid_currencies:
    - "USD"
    - "EUR"
    - "GBP"
    - "JPY"
  valid_categories:
    - "HIGH"
    - "MEDIUM"
    - "LOW"
  min_gross_amount: 0.01
  max_profit_margin: 100
  min_profit_margin: -100

# Logging configuration
logging:
  log_table: "etl_log"
  format: "parquet"
  path: "/data/logs/etl"
  level: "INFO"

# Runtime configuration
runtime:
  user: "etl_system"
  max_retries: 3
  timeout_seconds: 3600

# Business rules
business_rules:
  discount:
    tier1_quantity: 10
    tier1_rate: 0.05
    tier2_quantity: 15
    tier2_rate: 0.10
  tax_rate: 0.08
  cost_ratio: 0.60
  category_thresholds:
    high: 2000.00
    medium: 500.00

# Spark configuration
spark:
  app_name: "ETL_Loader"
  master: "local[*]"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"