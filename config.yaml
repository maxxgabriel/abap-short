# PySpark ETL Configuration for Sales Data Processing
spark:
  app_name: "SalesETLPipeline"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: "200"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"

# Data sources
sources:
  raw_sales:
    format: "parquet"
    path: "data/raw/sales"
    schema_validation: true
  
  # Alternative sources for integration testing
  test_raw_sales:
    format: "parquet"
    path: "tests/data/raw/sales"

# Data targets
targets:
  analytics:
    format: "parquet"
    path: "data/analytics/sales"
    mode: "append"
    partition_by: ["trans_date", "region"]
  
  etl_log:
    format: "parquet"
    path: "data/logs/etl"
    mode: "append"
  
  # Test targets
  test_analytics:
    format: "parquet"
    path: "tests/data/analytics/sales"
    mode: "overwrite"

# Business rules
business_rules:
  discount:
    tier1_quantity: 10
    tier1_rate: 0.05
    tier2_quantity: 15
    tier2_rate: 0.10
  
  tax:
    rate: 0.08
  
  cost:
    ratio: 0.60
  
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# ETL configuration
etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  test_mode: false

# Status codes
status_codes:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# Process steps
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Categories
categories:
  high: "HIGH"
  medium: "MEDIUM"
  low: "LOW"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl_process.log"