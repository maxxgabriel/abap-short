# ETL Business Rules and Configuration
# Migrated from ABAP ZCL_ETL_CONSTANTS
# All numeric values maintain precision from original ABAP definitions

business_rules:
  # Discount tier thresholds and rates
  discount:
    quantity_tier1: 10
    quantity_tier2: 15
    rate_tier1: 0.05  # 5% discount (DECIMALS 2)
    rate_tier2: 0.10  # 10% discount (DECIMALS 2)
  
  # Tax rate
  tax:
    rate: 0.08  # 8% tax rate (DECIMALS 2)
  
  # Cost calculation
  cost:
    ratio: 0.60  # 60% cost ratio (DECIMALS 2)
  
  # Category thresholds
  category:
    high_threshold: 2000.00   # >= $2000 (DECIMALS 2)
    medium_threshold: 500.00  # >= $500 (DECIMALS 2)

etl_configuration:
  # Batch processing settings
  batch_size: 1000
  commit_interval: 500
  
  # Error handling
  retry_attempts: 3
  timeout_seconds: 3600
  
  # Parallel processing
  parallel_jobs: 4
  
  # Logging
  log_level: "INFO"
  log_to_console: true
  log_to_file: true
  
  # Date ranges
  default_lookback_days: 7

spark_configuration:
  # Spark session settings
  app_name: "Sales ETL Process"
  master: "local[*]"
  
  # Memory settings
  driver_memory: "4g"
  executor_memory: "4g"
  
  # Shuffle partitions
  shuffle_partitions: 200
  
  # Serialization
  serializer: "org.apache.spark.serializer.KryoSerializer"

data_sources:
  # Input source configuration
  raw_sales:
    format: "delta"  # or "parquet", "jdbc"
    path: "data/raw/sales"
    
  # Output target configuration
  analytics:
    format: "delta"
    path: "data/analytics/sales"
    mode: "append"
  
  # Log storage
  etl_log:
    format: "delta"
    path: "data/logs/etl"

data_quality:
  # Validation rules
  mandatory_fields:
    - "trans_id"
    - "customer_id"
    - "product_id"
    - "currency"
  
  # Data type validation
  numeric_fields:
    - "quantity"
    - "unit_price"
    - "gross_amount"
    - "net_amount"
  
  # Thresholds
  max_error_rate: 0.05  # 5% maximum error rate
  min_record_count: 1