# ETL Configuration File
# Replaces ABAP configuration constants

# Application metadata
application:
  name: "Sales ETL System"
  version: "1.0.0"
  description: "PySpark ETL for sales data processing"

# Spark configuration
spark:
  app_name: "SalesETL"
  master: "local[*]"  # Use "yarn" for cluster mode
  executor_memory: "4g"
  executor_cores: 2
  executor_instances: 2
  driver_memory: "2g"
  shuffle_partitions: 200
  dynamic_allocation: true
  
# ETL process configuration (replaces ZCL_ETL_CONSTANTS)
etl:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  parallel_jobs: 4

# Business rules (replaces ABAP constants)
business_rules:
  discount:
    qty_tier1: 10
    qty_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10
  tax:
    rate: 0.08
  cost:
    ratio: 0.60
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Data paths
paths:
  raw_data: "data/raw/sales"
  analytics: "data/analytics/sales"
  logs: "logs/etl"
  checkpoint: "checkpoints/etl"

# Status codes (replaces gc_status)
status_codes:
  new: "N"
  processed: "P"
  error: "E"
  warning: "W"
  success: "S"
  info: "I"

# ETL process steps (replaces gc_step)
process_steps:
  init: "INIT"
  extract: "EXTRACT"
  transform: "TRANSFORM"
  load: "LOAD"
  validate: "VALIDATE"
  complete: "COMPLETE"
  error: "ERROR"

# Sale categories (replaces gc_category)
categories:
  high: "HIGH"
  medium: "MEDIUM"
  low: "LOW"

# ID prefixes
prefixes:
  etl_run: "ETL"
  log_id: "LOG"
  analytics_id: "ANL"

# Message texts (replaces gc_msg_*)
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"

# Validation rules
validation:
  max_date_range_days: 365
  required_fields:
    - trans_id
    - trans_date
    - customer_id
    - product_id
    - quantity
    - unit_price
  valid_currencies:
    - USD
    - EUR
    - GBP
  valid_regions:
    - NORTH
    - SOUTH
    - EAST
    - WEST

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console: true
  file: true
  max_file_size_mb: 100
  backup_count: 5

# Database/Storage configuration
storage:
  format: "parquet"  # parquet, delta, csv
  compression: "snappy"
  partition_by:
    - trans_date
    - region
  mode: "append"  # append, overwrite, error, ignore

# Performance tuning
performance:
  cache_intermediate: true
  broadcast_threshold: "10m"
  adaptive_query_execution: true
  cost_based_optimization: true