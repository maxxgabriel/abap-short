# ETL Configuration File
# This file contains all configurable parameters for the Sales ETL System

# Processing Configuration
batch_size: 1000
commit_interval: 500
retry_attempts: 3
timeout_seconds: 3600

# Spark Configuration
spark_app_name: "SalesETL"
spark_master: "local[*]"

spark_config:
  spark.sql.shuffle.partitions: "200"
  spark.sql.adaptive.enabled: "true"
  spark.sql.adaptive.coalescePartitions.enabled: "true"
  spark.sql.adaptive.advisoryPartitionSizeInBytes: "64MB"
  spark.sql.files.maxPartitionBytes: "128MB"
  spark.serializer: "org.apache.spark.serializer.KryoSerializer"
  spark.sql.execution.arrow.pyspark.enabled: "true"

# Data Paths
input_path: "/data/input/sales_raw"
output_path: "/data/output/sales_analytics"
log_path: "/data/logs/etl"

# Database Configuration (optional - for JDBC connections)
# db_url: "jdbc:postgresql://localhost:5432/etldb"
# db_user: "etl_user"
# db_password: "etl_password"
db_table_raw: "zsales_raw"
db_table_analytics: "zsales_analytics"
db_table_log: "zetl_log"

# Business Rules Override (optional)
rules_override:
  # discount_qty_tier1: 10
  # discount_qty_tier2: 15
  # discount_rate_tier1: 0.05
  # discount_rate_tier2: 0.10
  # tax_rate: 0.08
  # cost_ratio: 0.60
  # category_high_threshold: 2000.00
  # category_medium_threshold: 500.00

# Logging Configuration
log_level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# File Format Configuration
input_format: "parquet"  # parquet, csv, json
output_format: "parquet"

# CSV specific options (if using CSV format)
csv_options:
  header: true
  delimiter: ","
  quote: "\""
  escape: "\\"
  inferSchema: true

# Performance Tuning
enable_cache: true
enable_checkpoint: false
checkpoint_dir: "/data/checkpoint"

# Data Quality
enable_validation: true
validation_threshold: 0.95  # Minimum success rate
fail_on_validation_error: false