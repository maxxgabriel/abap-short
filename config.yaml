# ETL Configuration
# Replaces ABAP ZCL_ETL_CONSTANTS and etl_config.json

etl:
  # Process configuration
  process:
    batch_size: 1000
    commit_interval: 500
    parallel_jobs: 4
    timeout_seconds: 3600
  
  # Retry configuration
  retry:
    max_attempts: 3
    initial_delay_seconds: 1.0
    backoff_factor: 2.0
    retryable_errors:
      - "ConnectionError"
      - "TimeoutError"
      - "TransientError"
  
  # Business rules - Discount thresholds
  business_rules:
    discount:
      tier1:
        quantity_threshold: 10
        discount_rate: 0.05  # 5%
      tier2:
        quantity_threshold: 15
        discount_rate: 0.10  # 10%
    
    # Tax rate
    tax:
      rate: 0.08  # 8%
    
    # Cost ratio
    cost:
      ratio: 0.60  # 60%
    
    # Category thresholds
    category:
      high_threshold: 2000.00
      medium_threshold: 500.00

  # Status codes
  status:
    new: "N"
    processed: "P"
    error: "E"
    warning: "W"
    success: "S"
    info: "I"

  # Process steps
  steps:
    init: "INIT"
    extract: "EXTRACT"
    transform: "TRANSFORM"
    load: "LOAD"
    validate: "VALIDATE"
    complete: "COMPLETE"
    error: "ERROR"

  # Categories
  categories:
    high: "HIGH"
    medium: "MEDIUM"
    low: "LOW"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  handlers:
    console:
      enabled: true
      level: "INFO"
    file:
      enabled: true
      level: "DEBUG"
      filename: "logs/etl_{date}.log"
      max_bytes: 10485760  # 10MB
      backup_count: 5

# Database configuration (example)
database:
  source:
    type: "spark"
    format: "delta"
    path: "data/raw/sales_raw"
  
  target:
    type: "spark"
    format: "delta"
    path: "data/processed/sales_analytics"
  
  log:
    type: "spark"
    format: "delta"
    path: "data/logs/etl_log"

# Spark configuration
spark:
  app_name: "SalesETL"
  master: "local[*]"
  config:
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.shuffle.partitions: "200"
    spark.executor.memory: "4g"
    spark.driver.memory: "2g"

# Message templates
messages:
  init_success: "ETL process initialized successfully"
  extract_start: "Starting data extraction"
  extract_complete: "Data extraction completed"
  transform_start: "Starting data transformation"
  transform_complete: "Data transformation completed"
  load_start: "Starting data load"
  load_complete: "Data load completed"
  etl_complete: "ETL process completed successfully"
  etl_error: "ETL process failed"