# Unified Logging Framework Configuration
# Migrated from ABAP ETL system configuration

logging:
  # Delta table configuration
  delta_table_path: "dbfs:/mnt/etl/logs/delta"
  
  # Python logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  log_level: "INFO"
  
  # Logger name
  logger_name: "etl_logger"
  
  # Batch configuration
  buffer_size: 100  # Number of logs to buffer before flushing
  flush_interval_seconds: 60  # Auto-flush interval
  
  # Retention policy
  retention_days: 90  # Keep logs for 90 days
  
  # Status codes (migrated from ABAP constants)
  status_codes:
    success: "S"
    error: "E"
    warning: "W"
    info: "I"
  
  # Process steps (migrated from ABAP constants)
  process_steps:
    init: "INIT"
    extract: "EXTRACT"
    transform: "TRANSFORM"
    load: "LOAD"
    validate: "VALIDATE"
    complete: "COMPLETE"
    error: "ERROR"

# Spark configuration for Delta Lake
spark:
  app_name: "ETL_Logging_Framework"
  
  # Delta Lake extensions
  extensions:
    - "io.delta.sql.DeltaSparkSessionExtension"
  
  # Catalog configuration
  catalog:
    implementation: "org.apache.spark.sql.delta.catalog.DeltaCatalog"
  
  # Performance tuning
  shuffle_partitions: 200
  default_parallelism: 8
  
  # Delta Lake specific
  delta:
    autoOptimize_autoCompact: true
    autoOptimize_optimizeWrite: true

# Monitoring and alerting
monitoring:
  # Enable detailed metrics
  enable_metrics: true
  
  # Alert thresholds
  alerts:
    error_threshold: 10  # Alert if errors exceed this count
    warning_threshold: 50  # Alert if warnings exceed this count
    duration_threshold_minutes: 60  # Alert if ETL run exceeds this duration

# Database connection (for legacy ABAP table migration)
database:
  # Source ABAP tables
  source_tables:
    - "ZETL_LOG"
  
  # Migration settings
  migration:
    enabled: false
    batch_size: 10000