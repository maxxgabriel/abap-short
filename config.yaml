# ETL Integration Test Configuration
spark:
  app_name: "Sales_ETL_Integration_Tests"
  master: "local[*]"
  config:
    spark.sql.shuffle.partitions: 4
    spark.sql.adaptive.enabled: true
    spark.driver.memory: "2g"
    spark.executor.memory: "2g"

etl:
  # Business Rules
  discount:
    tier1_quantity: 10
    tier2_quantity: 15
    tier1_rate: 0.05
    tier2_rate: 0.10
  
  tax_rate: 0.08
  cost_ratio: 0.60
  
  # Category Thresholds
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00
  
  # Processing Configuration
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600

# Test Data Configuration
test_data:
  sample_size: 100
  date_range_days: 30
  regions:
    - "NORTH"
    - "SOUTH"
    - "EAST"
    - "WEST"
  currencies:
    - "USD"
    - "EUR"
    - "GBP"

# Database Configuration (for integration tests)
database:
  raw_sales_table: "raw_sales"
  analytics_table: "analytics"
  log_table: "etl_log"
  checkpoint_location: "/tmp/etl_checkpoint"

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/etl_integration_tests.log"