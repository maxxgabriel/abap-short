# PySpark ETL Orchestrator Configuration

# Application Settings
app:
  name: "Sales ETL Orchestrator"
  version: "1.0.0"
  environment: "production"

# Spark Configuration
spark:
  app_name: "ETL_Orchestrator"
  master: "local[*]"
  log_level: "WARN"
  config:
    spark.sql.shuffle.partitions: "200"
    spark.sql.adaptive.enabled: "true"
    spark.serializer: "org.apache.spark.serializer.KryoSerializer"

# ETL Run ID Configuration
run_id:
  prefix: "ETL"
  timestamp_format: "%Y%m%d%H%M%S"  # 14-digit timestamp

# Date Range Parameters
date_range:
  default_days_back: 7
  date_format: "%Y-%m-%d"

# Execution Parameters
execution:
  batch_size: 1000
  commit_interval: 500
  retry_attempts: 3
  timeout_seconds: 3600
  test_mode: false

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_enabled: true
  log_dir: "logs"
  console_enabled: true

# Phase Configuration
phases:
  extract:
    enabled: true
    timeout_seconds: 1800
  transform:
    enabled: true
    timeout_seconds: 1800
  load:
    enabled: true
    timeout_seconds: 1800

# Data Source Configuration
data_sources:
  raw_sales:
    format: "parquet"
    path: "data/raw/sales"
    schema_validation: true
  
# Data Target Configuration
data_targets:
  analytics:
    format: "parquet"
    path: "data/analytics/sales"
    mode: "append"
    partitionBy: ["trans_date"]

# Business Rules
business_rules:
  discount:
    quantity_tier1: 10
    quantity_tier2: 15
    rate_tier1: 0.05
    rate_tier2: 0.10
  tax:
    rate: 0.08
  cost:
    ratio: 0.60
  category:
    high_threshold: 2000.00
    medium_threshold: 500.00

# Monitoring
monitoring:
  metrics_enabled: true
  alert_on_failure: true
  summary_display: true